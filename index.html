<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Tracker</title>
<meta name="theme-color" content="#2f7d6d">
<meta name="description" content="Private food, nutrition, water and weight tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#23262b; --mute:#6b7078; --line:#e4e0d6;
  --accent:#2f7d6d; --accent-ink:#ffffff; --accent-soft:#e0efe9;
  --warn:#b4572f; --warn-soft:#f8e8df; --bar:#9bc4b9; --water:#3b82c4; --water-soft:#e1edf8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17191c; --card:#202327; --ink:#ebe9e3; --mute:#9aa0a8; --line:#33373d;
    --accent:#5fb7a3; --accent-ink:#0f1a17; --accent-soft:#25403a; --warn:#e59a73; --warn-soft:#3a2a22; --bar:#3f7a6d; --water:#6aa9e0; --water-soft:#1f2e3d; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 14px 110px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 10px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sync{font-size:12px;color:var(--mute);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;margin:0 -4px 12px;padding:0 4px 4px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 15px;font-weight:600;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.water{background:var(--water);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:16px}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.fav{display:inline-flex;gap:6px}
.chip.fav span{color:var(--mute);font-size:12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebar .lbl{font-weight:600;text-align:center;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--mute)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.warn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.food{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .n{flex:1;min-width:0;overflow-wrap:anywhere}
.food .n small{display:block;color:var(--mute);font-size:12px}
.food .c{color:var(--mute);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;padding:2px 8px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:0 0 auto}
.bars .b{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.bars .b i{display:block;height:10px;border-radius:5px;background:var(--bar)}
.bars .b em{font-style:normal;color:var(--mute);width:80px;flex:0 0 auto}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-child{border-top:0}
.entry .d{font-size:13px;color:var(--mute);margin-bottom:2px}
.entry p{margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{white-space:pre-wrap;line-height:1.6;margin-top:10px}
svg text{fill:var(--mute);font-size:11px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.nrow{display:grid;grid-template-columns:118px 1fr 92px;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.nrow .track{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.nrow .fill{height:100%;border-radius:5px;background:var(--accent)}
.nrow .fill.over{background:var(--warn)}
.nrow .fill.info{background:var(--bar)}
.nrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
.nrow .v b{color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);line-height:1;padding:0}
.est{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.est .top{display:flex;gap:8px;align-items:center}
.est .macro{font-size:13px;color:var(--mute);margin-top:4px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:5}
.dock .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock .meter{flex:1;min-width:0}
.dock .meter .t{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.dock .meter .t span{white-space:nowrap}
.dock .btn{white-space:nowrap}
@media (max-width:480px){.dock .meter .t .note{display:none}}
.dock .meter .tr{height:8px;border-radius:4px;background:var(--water-soft);margin-top:4px;overflow:hidden}
.dock .meter .fl{height:100%;background:var(--water);border-radius:4px}
.wrow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow span:last-child{font-variant-numeric:tabular-nums;color:var(--mute)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.scanner{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .bar{padding:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:#000}
.scanner .box{position:absolute;left:12%;right:12%;top:30%;height:26%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-align:left}
.toggle small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.toggle .car{font-size:18px;color:var(--mute)}
.collapse{margin-top:6px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
</style>
</head>
<body>
<div id="app">
  <header><h1>Health Tracker</h1><div class="hr"><button class="btn ghost small" data-tab="settings">⚙ Settings</button><div id="sync" class="sync">Loading…</div></div></header>
  <div id="banner"></div>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="dock" id="dock"></div>
<div class="scanner" id="scanner" hidden><video id="scanvideo" playsinline muted></video><div class="box"></div><div class="bar"><span>Point at the barcode</span><button class="btn" data-act="stopscan">Cancel</button></div></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return dstr(d); };
const addMonths = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const daysInMonth = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
const fmtDate = s => parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtMonth = ym => parse(ym+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = n => n==null ? '–' : (Math.round(n*10)/10).toString();
const r2 = n => Math.round((+n||0)*100)/100;
const sig = o => JSON.stringify(o, (k,v)=> v && typeof v==='object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a,k)=>(a[k]=v[k],a),{}) : v);
const uid = () => Math.random().toString(36).slice(2,9);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||uid();

const MEALS = ['Breakfast','Lunch','Dinner','Snack'];
const ACTIVITY = [[1.2,'Mostly sitting (desk job, little exercise)'],[1.375,'Light (walks or exercise 1–3 days/week)'],[1.55,'Moderate (exercise 3–5 days/week)'],[1.725,'Very active (hard exercise 6–7 days/week)']];
const OZ = 29.5735;
const FOOD_GROUPS = ['Vegetables','Fruits','Whole grains','Legumes','Nuts & seeds','Fish & seafood','Poultry & meat','Dairy & eggs','Other'];

/* ---------- nutrient definitions (targets = FDA Daily Values unless noted) ---------- */
const male = () => S.profile.sex==='m';
const DEFS = [
  {g:'Macros',k:'protein',l:'Protein',u:'g',ty:'min',t:()=>proteinTarget()},
  {g:'Macros',k:'carbs',l:'Carbs',u:'g',ty:'info',t:275},
  {g:'Macros',k:'fat',l:'Total fat',u:'g',ty:'info',t:78},
  {g:'Macros',k:'fiber',l:'Fiber',u:'g',ty:'min',t:28},
  {g:'Fats',k:'sat',l:'Saturated fat',u:'g',ty:'max',t:20},
  {g:'Fats',k:'trans',l:'Trans fat',u:'g',ty:'max',t:2},
  {g:'Fats',k:'mono',l:'Monounsaturated',u:'g',ty:'info'},
  {g:'Fats',k:'poly',l:'Polyunsaturated',u:'g',ty:'info'},
  {g:'Fats',k:'omega3',l:'Omega-3',u:'g',ty:'min',t:()=>male()?1.6:1.1},
  {g:'Sugar, sodium & caffeine',k:'sugar',l:'Total sugars',u:'g',ty:'info'},
  {g:'Sugar, sodium & caffeine',k:'addedSugar',l:'Added sugar',u:'g',ty:'max',t:()=>male()?36:25},
  {g:'Sugar, sodium & caffeine',k:'sodium',l:'Sodium',u:'mg',ty:'max',t:2300},
  {g:'Sugar, sodium & caffeine',k:'caffeine',l:'Caffeine',u:'mg',ty:'max',t:400},
  {g:'Minerals',k:'calcium',l:'Calcium',u:'mg',ty:'min',t:1300},
  {g:'Minerals',k:'iron',l:'Iron',u:'mg',ty:'min',t:18},
  {g:'Minerals',k:'magnesium',l:'Magnesium',u:'mg',ty:'min',t:420},
  {g:'Minerals',k:'potassium',l:'Potassium',u:'mg',ty:'min',t:4700},
  {g:'Minerals',k:'zinc',l:'Zinc',u:'mg',ty:'min',t:11},
  {g:'Vitamins',k:'vitA',l:'Vitamin A',u:'mcg',ty:'min',t:900},
  {g:'Vitamins',k:'vitC',l:'Vitamin C',u:'mg',ty:'min',t:90},
  {g:'Vitamins',k:'vitD',l:'Vitamin D',u:'mcg',ty:'min',t:20},
  {g:'Vitamins',k:'vitE',l:'Vitamin E',u:'mg',ty:'min',t:15},
  {g:'Vitamins',k:'vitK',l:'Vitamin K',u:'mcg',ty:'min',t:120},
  {g:'Vitamins',k:'b12',l:'Vitamin B12',u:'mcg',ty:'min',t:2.4},
  {g:'Vitamins',k:'folate',l:'Folate',u:'mcg',ty:'min',t:400},
  {g:'Vitamins',k:'b6',l:'Vitamin B6',u:'mg',ty:'min',t:1.7},
  {g:'Vitamins',k:'thiamin',l:'Thiamin (B1)',u:'mg',ty:'min',t:1.2},
  {g:'Vitamins',k:'riboflavin',l:'Riboflavin (B2)',u:'mg',ty:'min',t:1.3},
  {g:'Vitamins',k:'niacin',l:'Niacin (B3)',u:'mg',ty:'min',t:16}
];
const NKEYS = ['cal'].concat(DEFS.map(d=>d.k));
const tOf = d => typeof d.t==='function' ? d.t() : d.t;

/* ---------- state ---------- */
/* Fixed personal profile (single user). Weight is the starting weight; logged weights take over. */
const FIXED={sex:'m',age:29,height:71,weight:257,goal:215,goalDate:'2027-05-31',pace:1.5,activity:1.375,custom:''};
const S = {
  profile:Object.assign({},FIXED,{wake:7,bed:23}), open:{nutr:false,trends:false},
  days:{}, months:{}, foods:{},
  date:todayStr(), tab:'food', month:todayStr().slice(0,7), range:30, metric:'protein',
  foodMeal:null, loaded:false, ai:{busy:false},
  addMode:'describe', draft:{text:'',files:[],label:null,barcode:''}, est:null
};

/* ---------- persistence: on this device (localStorage) ---------- */
const LS='health-journal-v1', LSS='hj-settings';
const SET={apiKey:'',model:'claude-sonnet-5-5',remind:false,every:60,last:0};
try{ Object.assign(SET,JSON.parse(localStorage.getItem(LSS)||'{}')); }catch(e){}
function saveSet(){ try{ localStorage.setItem(LSS,JSON.stringify(SET)); }catch(e){} }
function setSync(t){ const e=$('#sync'); if(e) e.textContent=t; }
function loadLocal(){
  try{ const o=JSON.parse(localStorage.getItem(LS)||'null'); if(o){ Object.assign(S.profile,o.profile||{},FIXED); S.days=o.days||{}; S.months=o.months||{}; S.foods=o.foods||{}; } }catch(e){}
  S.loaded=true;
}
let saveT=null;
function saveLocal(){
  saveT=null;
  try{ localStorage.setItem(LS, JSON.stringify({profile:S.profile,days:S.days,months:S.months,foods:S.foods})); setSync('Saved on this device'); }
  catch(e){ setSync('Could not save (storage full or blocked)'); }
}
function queueSave(){ setSync('Saving…'); clearTimeout(saveT); saveT=setTimeout(saveLocal,400); }
function initStore(){
  loadLocal(); setSync('Saved on this device'); render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
function flushNow(){ if(saveT){ clearTimeout(saveT); saveLocal(); } }
window.addEventListener('pagehide',flushNow);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushNow(); });

/* ---------- data access ---------- */
function day(date){ return S.days[date] || {date,foods:[],water:[]}; }
function editDay(date,fn){
  const d=S.days[date] || (S.days[date]={date,foods:[],water:[]});
  d.foods=d.foods||[]; d.water=d.water||[];
  fn(d); queueSave('days',date);
}
function editMonth(ym,fn){ const m=S.months[ym]||(S.months[ym]={}); fn(m); queueSave('months',ym); }
function editProfile(fn){ fn(S.profile); queueSave('profile','p'); }

const fval = (f,k) => k==='cal' ? (+f.cal||0) : (+(f.n&&f.n[k])||0);
function dayTotals(d){
  const t={}; NKEYS.forEach(k=>t[k]=0);
  ((d&&d.foods)||[]).forEach(f=>NKEYS.forEach(k=>{ t[k]+=fval(f,k); }));
  return t;
}
const dayCals = d => dayTotals(d).cal;
const hasFood = d => d && d.foods && d.foods.length>0;
const waterMl = d => ((d&&d.water)||[]).reduce((a,w)=>a+(+w.ml||0),0);
function latestWeight(){
  const ks=Object.keys(S.days).filter(k=>S.days[k].weight).sort();
  return ks.length ? +S.days[ks[ks.length-1]].weight : (+S.profile.weight||null);
}
function proteinTarget(){ const w=latestWeight(); return w ? Math.round(Math.max(50,0.8*w*0.45359237)) : 50; }

/* ---------- calorie / goal math ---------- */
function calc(){
  const p=S.profile, w=latestWeight();
  if(!(+p.age && +p.height && w)) return null;
  const kg=w*0.45359237, cm=+p.height*2.54;
  const bmr=10*kg+6.25*cm-5*(+p.age)+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.activity||1.375);
  const floor=p.sex==='m'?1500:1200;
  const raw=tdee-(+p.pace||0)*500;
  const target=Math.max(floor,Math.round(raw/10)*10);
  const limited = raw<floor;
  const bmiLo=18.5*Math.pow(+p.height*0.0254,2)/0.45359237, bmiHi=24.9*Math.pow(+p.height*0.0254,2)/0.45359237;
  return {w,bmr:Math.round(bmr),tdee:Math.round(tdee),target,limited,floor,bmiLo:Math.round(bmiLo),bmiHi:Math.round(bmiHi)};
}
function targetCal(){ const p=S.profile; if(+p.custom>0) return +p.custom; const c=calc(); return c?c.target:null; }

/* ---------- water goal: recalculated from what you have logged ---------- */
const WATER_RULES = [
  ['Baseline (body weight)', null, 'mL per kg of body weight: 20'],
  ['Calories eaten','cal',0.15],
  ['Protein','protein',3],
  ['Fiber','fiber',8],
  ['Sodium','sodium',0.15],
  ['Caffeine','caffeine',0.5],
  ['Added sugar','addedSugar',2]
];
function waterGoal(date){
  const t=dayTotals(day(date)), w=latestWeight(), assumed=!w;
  const kg=(w||154)*0.45359237;
  const parts=[{l:'Baseline (body weight)',ml:20*kg}];
  WATER_RULES.slice(1).forEach(([l,k,m])=>parts.push({l,ml:m*t[k]}));
  const raw=parts.reduce((a,p)=>a+p.ml,0);
  const total=Math.min(5500,Math.max(1500,raw));
  return {parts,total,oz:total/OZ,assumed};
}
function waterPace(date,goalMl){
  if(date!==todayStr()) return null;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60;
  const wake=+S.profile.wake||7, bed=+S.profile.bed||23;
  const frac=Math.min(1,Math.max(0,(h-wake)/Math.max(1,bed-wake)));
  const expected=goalMl*frac, drunk=waterMl(day(date));
  return {frac,expected,behind:expected-drunk,h,bed,wake};
}

/* ---------- charts (inline SVG) ---------- */
function chart(vals,labels,opt={}){
  const nums=vals.filter(v=>v!=null);
  if(!nums.length) return '<div class="empty">Nothing logged in this range yet.</div>';
  const W=600,H=opt.h||130,L=34,R=8,T=8,B=20,n=vals.length;
  let lo=opt.min!=null?opt.min:Math.min(...nums), hi=opt.max!=null?opt.max:Math.max(...nums);
  if(opt.target!=null){ lo=Math.min(lo,opt.target); hi=Math.max(hi,opt.target); }
  if(opt.bar) lo=0;
  if(opt.min==null && !opt.bar){ const padv=(hi-lo)*0.15||1; lo-=padv; hi+=padv; }
  if(hi===lo) hi=lo+1;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const iw=W-L-R, slot=iw/n;
  const x=i=> opt.bar ? L+i*slot+slot/2 : L+(n===1?iw/2:i*iw/(n-1));
  let g='';
  [lo,hi].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v*10)/10}</text>`; });
  if(opt.target!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(opt.target)-4}" text-anchor="end" style="fill:var(--warn)">${opt.tlabel||'goal'} ${Math.round(opt.target*10)/10}</text>`;
  if(opt.bar){
    vals.forEach((v,i)=>{ if(v==null) return; const bw=Math.max(2,slot*0.7), yy=y(v);
      const over = opt.over && opt.target!=null && v>opt.target*1.1;
      g+=`<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="2" fill="${over?'var(--warn)':(opt.color||'var(--bar)')}"/>`; });
  } else {
    let d='',pen=false;
    vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true; });
    g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    vals.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n>45?1.8:3}" fill="var(--accent)"/>`; });
  }
  g+=`<text x="${L}" y="${H-4}">${esc(labels[0])}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${esc(labels[n-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'chart')}">${g}</svg>`;
}

function mealGuess(){ const h=new Date().getHours(); return h<10?'Breakfast':h<14?'Lunch':h<17?'Snack':h<21?'Dinner':'Snack'; }
function favorites(){

  Object.keys(S.days).filter(k=>k>=cut).forEach(k=>(S.days[k].foods||[]).forEach(f=>{

function macroLine(o){ return `${Math.round(o.cal||0)} cal · P ${r1(o.protein||0)}g · C ${r1(o.carbs||0)}g · F ${r1(o.fat||0)}g`; }

/* ----- nutrients (collapsible, top of Food tab) ----- */
function nutrSummary(t){ return `Protein ${Math.round(t.protein)}/${proteinTarget()} g · Fiber ${Math.round(t.fiber)}/28 g · Sodium ${Math.round(t.sodium)} mg`; }
function nutrBody(){
  const d=day(S.date), t=dayTotals(d), fl=d.foods||[];
  const partial=fl.filter(f=>!f.n||!Object.keys(f.n).length).length;
  const sections=[...new Set(DEFS.map(x=>x.g))];
  const rows=g=>DEFS.filter(x=>x.g===g).map(x=>{
    const v=t[x.k], tg=tOf(x), pct=tg?v/tg*100:null;
    const cls=x.ty==='max'?(v>tg?'over':''):x.ty==='info'?'info':'';
    const w=tg?Math.min(100,pct):0;
    return `<div class="nrow"><span>${x.l}</span><div class="track">${tg?`<div class="fill ${cls}" style="width:${w}%"></div>`:''}</div><span class="v"><b>${r1(v)}</b> ${x.u}${tg?` · ${Math.round(pct)}%`:''}</span></div>`;
  }).join('');
  const dayGroups=new Set(); fl.forEach(f=>(f.groups||[]).forEach(g=>dayGroups.add(g)));
  const plants=weekPlants(S.date);
  return (fl.length?'':'<div class="empty">Log food to see nutrients here.</div>')+
  (partial?`<div class="warn" style="margin:8px 0">${partial} entr${partial>1?'ies have':'y has'} calories only, so these totals may be low.</div>`:'')+
  `<div class="note" style="margin-top:6px">Bars show % of a typical daily target. Green is “get enough”, orange means over a “keep under” limit.</div>`+
  sections.map(g=>`<div style="margin-top:14px"><h3>${g}</h3>${rows(g)}</div>`).join('')+
  `<div style="margin-top:14px"><h3>Food variety</h3>
    <div class="row sb" style="margin-bottom:6px"><span><b>${dayGroups.size}</b> of ${FOOD_GROUPS.length} food groups today</span><span><b>${plants.length}</b> / 30 different plants this week</span></div>
    <div class="chips">${FOOD_GROUPS.map(g=>`<span class="chip ${dayGroups.has(g)?'on':''}">${g}</span>`).join('')}</div>
    ${plants.length?`<div class="note" style="margin-top:8px">This week: ${esc(plants.join(', '))}</div>`:'<div class="note" style="margin-top:8px">Plants include vegetables, fruit, whole grains, beans, nuts, seeds, herbs and spices. Eating around 30 different ones a week is a common variety goal for gut health.</div>'}</div>
  <div class="note" style="margin-top:14px">Targets are FDA Daily Values (adult), with protein at 0.8 g per kg of body weight and added sugar at the American Heart Association limit. Photo estimates are approximate and your own needs vary with age, sex and health.</div>`;
}
function weekPlants(date){
  const set=new Map();
  for(let i=0;i<7;i++){ const dd=S.days[addDays(date,-i)]; ((dd&&dd.foods)||[]).forEach(f=>(f.plants||[]).forEach(p=>{ const k=String(p).trim().toLowerCase(); if(k) set.set(k,k); })); }
  return [...set.keys()].sort();
}

/* ----- water ----- */
function vWater(){

  return dateBar()+`<div class="card"><div class="ring"><svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="${Math.round(drunk/OZ)} of ${Math.round(g.oz)} ounces"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--water-soft)" stroke-width="10"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--water)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 55 55)"/><text x="55" y="53" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--ink)">${Math.round(drunk/OZ)}</text><text x="55" y="70" text-anchor="middle">of ${Math.round(g.oz)} oz</text></svg>
    <div><div style="font-size:20px;font-weight:700">${left>0?Math.round(left/OZ)+' oz to go':'Goal reached'}</div><div class="note">${esc(paceMsg)}</div></div></div>
    <div class="row" style="margin-top:12px">${[8,12,16,24].map(n=>`<button class="btn water small" data-act="water" data-oz="${n}">+${n} oz</button>`).join('')}

    <div class="note" style="margin-top:6px">Log any fluid you drink. Plain water is best.</div>

  <div class="card"><h2>How your goal is calculated</h2>

    <div class="note" style="margin-top:8px">The goal is recalculated every time you add or remove food. Baseline is 20 mL per kg of body weight; then add 0.15 mL per calorie, 3 mL per g protein, 8 mL per g fiber, 0.15 mL per mg sodium, 0.5 mL per mg caffeine and 2 mL per g added sugar (kept between 1.5 and 5.5 L). This is a practical estimate, not medical advice. Exercise, heat and illness raise your needs, and if you have kidney, heart or other conditions, follow your doctor’s fluid advice instead.</div></div>

    <div class="note" style="margin-top:8px">The bar at the bottom of every tab compares your drinking to a steady pace across that window. This page can only nudge you while it is open. For a buzzing reminder, set a repeating alarm on your phone for the times you want to drink.</div></div>`;
}

/* ----- calorie balance: food eaten vs calories burned ----- */
function burnFor(date){
  const d=S.days[date]||{}, c=calc(); if(!c) return null;
  if(+d.burned>0) return {kcal:+d.burned,basis:'Total burned you entered (Samsung Health)',real:true};
  if(+d.active>0) return {kcal:c.bmr+(+d.active),basis:'Resting burn (estimated) + active calories you entered',real:true};
  return {kcal:c.tdee,basis:'Estimated from your activity level (no activity entered)',real:false};
}
function dayBalance(date){
  const c=calc(); if(!c) return null;
  const b=burnFor(date), eaten=Math.round(dayCals(day(date)));
  const tdef=(+S.profile.pace||0)*500;
  const burn=Math.round(b.kcal), allow=Math.max(c.floor,Math.round(burn-tdef));
  return {burn,basis:b.basis,real:b.real,eaten,deficit:burn-eaten,tdef,allow,left:allow-eaten,floor:c.floor,bmr:c.bmr};
}
function weekBalance(){
  const today=todayStr(), end=S.date===today?addDays(today,-1):S.date;
  const rows=[]; for(let i=6;i>=0;i--){ const k=addDays(end,-i); rows.push({k,b:dayBalance(k),logged:hasFood(S.days[k])}); }
  const used=rows.filter(r=>r.logged&&r.b), n=used.length;
  const avgDef=n?used.reduce((a,r)=>a+r.b.deficit,0)/n:null;
  const under=used.filter(r=>r.b.eaten<r.b.floor).length;
  const ws=[]; for(let i=13;i>=0;i--){ const k=addDays(end,-i); const w=S.days[k]&&S.days[k].weight; if(w) ws.push([k,+w]); }
  let actual=null;
  if(ws.length>=2){ const span=(parse(ws[ws.length-1][0])-parse(ws[0][0]))/86400000; if(span>=5) actual=(ws[0][1]-ws[ws.length-1][1])/span*7; }

}
function verdict(wb,tdef){

  const a=wb.avgDef;
  if(wb.under>=2) return {tone:'warn',title:'Eating below the minimum',msg:`On ${wb.under} days you ate under ${wb.rows.find(r=>r.b)?.b.floor} calories. A bigger deficit that way is not healthy or sustainable. Eat at least your minimum, even if it slows the numbers.`};
  if(tdef===0) return Math.abs(a)<=150?{tone:'ok',title:'On track to maintain',msg:'Your intake is close to what you burn.'}:{tone:'',title:a>0?'Running a deficit':'Running a surplus',msg:`You average ${Math.round(Math.abs(a))} cal/day ${a>0?'under':'over'} what you burn.`};
  const r=a/tdef;
  if(r>=0.9) return {tone:'ok',title:'On track',msg:`You are averaging a ${Math.round(a)} cal/day deficit against a goal of ${Math.round(tdef)}. ${r>1.4?'That is well ahead of plan. Make sure you are eating enough and feeling OK.':'Nice and steady.'}`};
  if(r>=0.5) return {tone:'',title:'Slightly behind',msg:`Averaging a ${Math.round(a)} cal/day deficit against ${Math.round(tdef)}. About ${Math.round(tdef-a)} cal/day more (a snack or a 20-minute walk) would close the gap.`};
  return {tone:'warn',title:'Behind pace',msg:a>0?`Averaging only a ${Math.round(a)} cal/day deficit against ${Math.round(tdef)}.`:`You are averaging about ${Math.round(-a)} cal/day over what you burn.`};
}

async function toJpeg(blob,max=1400){
  const bmp=await createImageBitmap(blob);
  const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',0.82));
}
async function detectBarcode(blob){
  try{
    if(!('BarcodeDetector' in window)) return null;
    const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    const bmp=await createImageBitmap(blob); const r=await bd.detect(bmp);
    return r&&r[0]?String(r[0].rawValue):null;
  }catch(e){ return null; }
}

const SCHEMA = `Return JSON: {"items":[{"name":str,"serving_desc":str,"cal":number,"protein":g,"carbs":g,"fat":g,"sat":g,"trans":g,"mono":g,"poly":g,"omega3":g,"fiber":g,"sugar":g,"addedSugar":g,"sodium":mg,"caffeine":mg,"vitA":mcg RAE,"vitC":mg,"vitD":mcg,"vitE":mg,"vitK":mcg,"b12":mcg,"folate":mcg DFE,"b6":mg,"thiamin":mg,"riboflavin":mg,"niacin":mg,"calcium":mg,"iron":mg,"magnesium":mg,"potassium":mg,"zinc":mg,"groups":[from: ${FOOD_GROUPS.join(', ')}],"plants":[distinct plant foods in it, lowercase singular, e.g. "spinach","oat","almond","cumin"],"notes":str}]}. Use numbers only (0 when negligible, best estimate otherwise; never null). Keep notes under 120 characters (say what you assumed or could not see).`;
/* Claude API (your own key, called straight from this device) */
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); }); }
async function claudeText(prompt,blobs,max){
  if(!SET.apiKey) throw {message:'Add your Anthropic API key in Settings to use photo and description estimates.'};
  const content=[];
  for(const b of (blobs||[])){ const j=await toJpeg(b); content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobToB64(j)}}); }
  content.push({type:'text',text:prompt});
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':SET.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:SET.model||'claude-sonnet-5-5',max_tokens:max||3000,messages:[{role:'user',content}]})});
  }catch(e){ throw {message:'Could not reach Claude. Check your internet connection.'}; }
  if(!r.ok){
    let m=''; try{ m=(await r.json()).error.message; }catch(e){}
    throw {code:r.status,message:r.status===401?'Your API key was rejected. Check it in Settings.':r.status===429?'Too many requests right now. Wait a minute and try again.':'Claude request failed ('+r.status+'). '+m};
  }
  const j=await r.json();
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
async function claudeJson(prompt,blobs){
  const t=await claudeText(prompt+'\n\nRespond with ONLY the JSON object and no other text.',blobs,3500);
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw {message:'I could not read the answer. Please try again.'};
  try{ return JSON.parse(m[0]); }catch(e){ throw {message:'I could not read the answer. Please try again.'}; }
}

function errMsg(e){
  if(e&&e.code==='not_granted') return 'Claude estimates are not available in this view.';
  if(e&&e.code==='rate_limited') return 'Too many requests right now. Wait a minute and try again.';
  return (e&&e.message)||'Something went wrong while reading that. Please try again.';
}
async function runEstimate(){
  const dr=S.draft, text=dr.text.trim();
  if(!text && !dr.files.length){ S.est={error:'Add a photo or describe what you ate first.'}; render(); return; }
  S.est={busy:true,msg:'Claude is looking at your meal…'}; render();
  try{
    const prompt=`You are a careful nutrition estimator. The user ate the meal described and/or shown. List each distinct food or drink as its own item with nutrition for the whole portion actually eaten (not per 100 g). Estimate portion sizes from the photo (plate size, utensils) and say what you assumed in notes. Include cooking fats and condiments you can reasonably infer. For drinks like coffee, set caffeine. Do not invent items that are not mentioned or visible.\n\nUser description: ${text||'(none, photo only)'}\n\n${SCHEMA}`;
    const res=await callClaude(prompt,dr.files.map(f=>f.blob));
    const items=cleanItems(res);
    S.est=items.length?{items,src:'estimate'}:{error:'I could not identify any food. Try adding a clearer photo or a short description.'};
  }catch(e){ S.est={error:errMsg(e)}; }
  render();
}
/* ---------- Open Food Facts barcode lookup ---------- */
const OFFMAP={protein:['proteins',1],carbs:['carbohydrates',1],fat:['fat',1],sat:['saturated-fat',1],trans:['trans-fat',1],mono:['monounsaturated-fat',1],poly:['polyunsaturated-fat',1],omega3:['omega-3-fat',1],fiber:['fiber',1],sugar:['sugars',1],addedSugar:['added-sugars',1],sodium:['sodium',1000],caffeine:['caffeine',1000],vitA:['vitamin-a',1e6],vitC:['vitamin-c',1000],vitD:['vitamin-d',1e6],vitE:['vitamin-e',1000],vitK:['vitamin-k',1e6],b12:['vitamin-b12',1e6],folate:['vitamin-b9',1e6],b6:['vitamin-b6',1000],thiamin:['vitamin-b1',1000],riboflavin:['vitamin-b2',1000],niacin:['vitamin-pp',1000],calcium:['calcium',1000],iron:['iron',1000],magnesium:['magnesium',1000],potassium:['potassium',1000],zinc:['zinc',1000]};
function parseOFF(p){
  const n=p.nutriments||{}, sq=+p.serving_quantity||0;
  const get=key=>{ if(n[key+'_serving']!=null && n[key+'_serving']!=='') return +n[key+'_serving']; if(n[key+'_100g']!=null && n[key+'_100g']!=='') return +n[key+'_100g']*(sq?sq/100:1); return null; };
  let cal=get('energy-kcal'); if(cal==null){ const kj=get('energy'); if(kj!=null) cal=kj/4.184; }
  if(cal==null || !isFinite(cal)) return null;
  const it={name:[p.brands&&String(p.brands).split(',')[0].trim(),p.product_name].filter(Boolean).join(' ')||'Scanned product',
    serving_desc:sq?(p.serving_size||sq+' g'):'100 g (no serving size listed)',cal:Math.round(cal),groups:[],plants:[],qty:1,save:true};
  let have=0;
  Object.keys(OFFMAP).forEach(k=>{ const [key,f]=OFFMAP[k]; let v=get(key); if(v==null && k==='sodium'){ const s=get('salt'); if(s!=null) v=s*0.4; }
    it[k]=(v!=null&&isFinite(v)&&v>0)?r2(v*f):0; if(v!=null) have++; });
  it.notes=have<8?'The food database has limited detail for this product, so some vitamins and minerals show as 0.':'From Open Food Facts. Check against the package if something looks off.';
  return it;
}
async function offLookup(code){
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,serving_size,serving_quantity,nutriments');
  if(r.status===404) return null;
  if(!r.ok) throw new Error('lookup failed');
  const j=await r.json();
  if(!j||j.status!==1||!j.product) return null;
  return parseOFF(j.product);
}

/* ---------- live barcode scanner ---------- */
let scanStream=null, scanning=false;
async function startScan(){
  if(!('BarcodeDetector' in window)){ S.est={error:'Live scanning is not supported by this browser. Take a photo of the barcode instead, or type the number.'}; render(); return; }
  try{ scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ S.est={error:'Camera access was blocked. Allow the camera for this site in your browser settings, or take a photo instead.'}; render(); return; }
  const v=$('#scanvideo'); v.srcObject=scanStream; try{ await v.play(); }catch(e){}
  $('#scanner').hidden=false; scanning=true;
  const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
  const loop=async()=>{
    if(!scanning) return;
    try{ const r=await bd.detect(v); if(r&&r[0]){ const code=String(r[0].rawValue); stopScan(); S.draft.barcode=code; try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} readLabel(); return; } }catch(e){}
    setTimeout(loop,250);
  };
  loop();
}
function stopScan(){ scanning=false; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } const o=$('#scanner'); if(o) o.hidden=true; }

async function readLabel(){
  const dr=S.draft; let code=(dr.barcode||'').replace(/\D/g,'');
  if(!code && dr.label){ S.est={busy:true,msg:'Checking the barcode…'}; render(); code=(await detectBarcode(dr.label.blob))||''; if(code) dr.barcode=code; }
  if(code && S.foods[code]){
    const p=S.foods[code]; S.est={items:[Object.assign({},p,{qty:1,save:false,notes:'Saved product'})],src:'barcode',barcode:code}; render(); return;
  }
  if(code){
    S.est={busy:true,msg:'Looking up barcode '+code+'…'}; render();
    try{
      const it=await offLookup(code);
      if(it){ S.est={items:[it],src:'barcode',barcode:code}; render(); return; }
    }catch(e){
      if(!dr.label){ S.est={error:'Could not reach the food database. Check your connection and try again.'}; render(); return; }
    }
  }
  if(!dr.label){
    S.est={error: code?`Barcode ${code} was not found in the food database. Take a photo of its nutrition label and Claude will read it, or add it manually.`:'Scan a barcode, take a photo of the nutrition label, or type the barcode number.'}; render(); return;
  }
  S.est={busy:true,msg:'Claude is reading the label…'}; render();
  try{
    const prompt=`Read this packaged-food photo. If a Nutrition Facts label is visible, extract the values exactly as printed per ONE serving and put the printed serving size in serving_desc. Percent Daily Values on the label can be converted to amounts using FDA Daily Values (vitamin D 20 mcg, calcium 1300 mg, iron 18 mg, potassium 4700 mg, vitamin A 900 mcg, vitamin C 90 mg, etc.). Anything not on the label: give a reasonable estimate for this product, or 0. If there is no label (only the front of a package or the food itself), identify the product and estimate, and say so in notes. Return exactly one item.${code?`\nBarcode: ${code}`:''}\n\n${SCHEMA}`;
    const res=await callClaude(prompt,[dr.label.blob]);
    const items=cleanItems(res).slice(0,1); items.forEach(it=>{ it.save=true; });
    S.est=items.length?{items,src:'label',barcode:code}:{error:'I could not read a label in that photo. Try a closer, well-lit shot of the Nutrition Facts panel.'};
  }catch(e){ S.est={error:errMsg(e)}; }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  const a=t.dataset.act;
  switch(a){
    case 'prev': S.date=addDays(S.date,-1); render(); break;
    case 'next': if(S.date<todayStr()){ S.date=addDays(S.date,1); render(); } break;
    case 'today': S.date=todayStr(); render(); break;
    case 'gotab': S.tab=t.dataset.t; render(); break;
    case 'gomonth': S.month=t.dataset.m; S.tab='progress'; render(); break;
    case 'meal': S.foodMeal=t.dataset.m; render(); break;
    case 'mode': S.addMode=t.dataset.m; S.est=null; render(); break;
    case 'fav': { const f=favorites()[+t.dataset.i]; if(f) addFoodObj(f.food); break; }
    case 'prod': { const p=S.foods[t.dataset.id]; if(p) pushFood(makeFood(p,1,S.foodMeal||mealGuess(),'saved')), render(); break; }
    case 'delfood': editDay(S.date,d=>{ d.foods=d.foods.filter(f=>f.id!==t.dataset.id); }); render(); break;
    case 'estimate': runEstimate(); break;
    case 'readlabel': readLabel(); break;
    case 'estadd': addEstItem(+t.dataset.i); break;
    case 'estaddall': { while(S.est&&S.est.items&&S.est.items.length) addEstItem(0); break; }
    case 'estclear': S.est=null; render(); break;
    case 'rmphoto': { const kind=t.dataset.kind; if(kind==='label'){ if(S.draft.label){try{URL.revokeObjectURL(S.draft.label.url)}catch(e){}} S.draft.label=null; } else { const f=S.draft.files.splice(+t.dataset.i,1)[0]; if(f){try{URL.revokeObjectURL(f.url)}catch(e){}} } render(); break; }
    case 'water': editDay(S.date,d=>{ d.water.push({id:uid(),ml:Math.round(+t.dataset.oz*OZ),t:Date.now()}); }); render(); break;
    case 'watercustom': { const v=+($('#w-custom')||{}).value; if(v>0){ editDay(S.date,d=>{ d.water.push({id:uid(),ml:Math.round(v*OZ),t:Date.now()}); }); render(); } break; }
    case 'delwater': editDay(S.date,d=>{ d.water=d.water.filter(w=>w.id!==t.dataset.id); }); render(); break;
    case 'range': S.range=+t.dataset.n; render(); break;
    case 'mprev': S.month=addMonths(S.month,-1); render(); break;
    case 'mnext': if(S.month<todayStr().slice(0,7)){ S.month=addMonths(S.month,1); render(); } break;
    case 'reflect': reflect(); break;
    case 'toggle': S.open[t.dataset.k]=!S.open[t.dataset.k]; render(); break;
    case 'export': exportData(); break;
    case 'scan': startScan(); break;
    case 'stopscan': stopScan(); break;
    case 'install': if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; render(); } break;
    case 'notifperm': if('Notification' in window){ Notification.requestPermission().then(()=>render()); } break;
  }
});
document.addEventListener('submit',e=>{

document.addEventListener('input',e=>{
  const t=e.target;

    if(f==='weight'||f==='active'||f==='burned') v = v===''?null:+v;
    editDay(S.date,d=>{ d[f]=v; }); renderDock();

  } else if(t.dataset.draft){ S.draft[t.dataset.draft]=t.value;

  } else if(t.dataset.pf){ editProfile(p=>{ p[t.dataset.pf]=t.value; }); renderDock(); }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.pf) return; /* input handler already updates; re-rendering here would swallow the next tap */
  if(t.dataset.import){ const f=t.files&&t.files[0]; t.value=''; if(f) importData(f); return; }
  if(t.dataset.metric!=null){ S.metric=t.value; render(); return; }
  if(t.dataset.ei!=null){ const it=S.est&&S.est.items&&S.est.items[+t.dataset.ei]; if(!it) return;
    if(t.dataset.ef==='qty'){ it.qty=Math.max(0.25,+t.value||1); const m=t.closest('.est').querySelector('.macro'); if(m) m.textContent=(it.serving_desc||'1 serving')+' → '+macroLine(scaled(it)); }
    else if(t.dataset.ef==='save'){ it.save=t.checked; }
    return; }
  if(t.dataset.file){
    const files=[...t.files||[]].filter(f=>f.type.startsWith('image/')); t.value='';
    if(!files.length) return;
    if(t.dataset.file==='label'){ if(S.draft.label){try{URL.revokeObjectURL(S.draft.label.url)}catch(e){}} const f=files[0]; S.draft.label={blob:f,url:URL.createObjectURL(f)}; const code=await detectBarcode(f); if(code) S.draft.barcode=code; }
    else files.slice(0,3-S.draft.files.length).forEach(f=>S.draft.files.push({blob:f,url:URL.createObjectURL(f)}));
    render();
  }
});

/* ---------- monthly reflection with Claude ---------- */
function digest(ym){
  const st=monthStats(ym), m=S.months[ym]||{};
  const L=[];
  L.push(`MONTH: ${fmtMonth(ym)}`);
  L.push(`My goals for the month: ${m.intentions||'(none written)'}`);
  const c=calc();
  L.push(`My target: ${st.tgt?st.tgt+' calories/day':'not set'}${S.profile.pace?`; losing ${S.profile.pace} lb/week`:''}${S.profile.goal?`; goal weight ${S.profile.goal} lb`:''}.`);
  L.push(`Averages (on days logged): ${st.foodDays} days of food logged; calories ${st.cal??'n/a'}; protein ${r1(st.protein)} g; fiber ${r1(st.fiber)} g; added sugar ${r1(st.addedSugar)} g; sodium ${st.sodium!=null?Math.round(st.sodium):'n/a'} mg; water ${r1(st.water)} oz; average daily calorie deficit ${st.avgDef!=null?Math.round(st.avgDef):'n/a'}; ${st.plants} different plants eaten${st.w0&&st.w1?`; weight ${st.w0.w} to ${st.w1.w} lb`:''}.`);
  L.push('DAILY ENTRIES:');
  st.rows.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
    const t=dayTotals(r), b=c&&hasFood(r)?dayBalance(r.date):null;
    L.push(`${r.date} | cal ${hasFood(r)?Math.round(t.cal):'-'} protein ${hasFood(r)?Math.round(t.protein):'-'} fiber ${hasFood(r)?Math.round(t.fiber):'-'} added sugar ${hasFood(r)?Math.round(t.addedSugar):'-'} sodium ${hasFood(r)?Math.round(t.sodium):'-'} | water ${Math.round(waterMl(r)/OZ)||'-'} oz | weight ${r.weight||'-'} | active kcal ${r.active||'-'} | deficit ${b?b.deficit:'-'}`);
  });
  return L.join('\n');
}
async function reflect(){
  const ym=S.month, st=monthStats(ym);
  const out=$('#aiout');
  if(!st.rows.length){ out.textContent='There is nothing logged this month yet. Log some food, water or weight first.'; return; }
  if(!SET.apiKey){ out.textContent='Add your Anthropic API key in Settings to use the Claude summary.'; return; }
  S.ai={busy:true,month:ym,text:''}; const btn=$('[data-act="reflect"]'); if(btn){ btn.disabled=true; btn.textContent='Summarizing…'; }
  const prompt=`You are a supportive nutrition and wellness coach reviewing one month of someone's food, water, weight and activity tracking. Write in second person, kind and practical, never judgmental about food or weight. You are not a doctor; do not diagnose or prescribe, and suggest checking with a doctor or registered dietitian for medical questions.\n\nUse exactly these sections with short plain headings:\n1. The shape of the month (2-3 sentences)\n2. Nutrition patterns (protein, fiber, added sugar, sodium, variety; where I am doing well and where to adjust)\n3. Hydration\n4. Energy balance and progress toward my weight goal (compare my deficit and weight change with my pace; say when the data is too thin to tell)\n5. Things to celebrate\n6. Progress on my goals for the month\n7. Suggested focus for next month (2-3 small, concrete ideas)\n\nKeep it under 450 words. Plain text, no markdown symbols.\n\nHere is my data:\n${digest(ym)}`;
  try{
    const text=await claudeText(prompt,[],1500);
    S.ai.text=text; editMonth(ym,m=>{ m.ai=text; });
    const o=$('#aiout'); if(o&&S.month===ym) o.textContent=text;
  }catch(e){
    const o=$('#aiout'); if(o) o.textContent=errMsg(e);
  }
  S.ai.busy=false; const b=$('[data-act="reflect"]'); if(b){ b.disabled=false; b.textContent='Summarize again'; }
}

/* ---------- backup / restore ---------- */
function exportData(){
  const json=JSON.stringify({app:'health-journal',version:1,exported:new Date().toISOString(),profile:S.profile,days:S.days,months:S.months,products:S.foods},null,2);
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='health-journal-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
    setSync('Backup downloaded');
  }catch(e){ setSync('Could not create backup'); }
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.app!=='health-journal'||typeof o.days!=='object') throw new Error('bad file');
      S.days=Object.assign({},S.days,o.days); S.months=Object.assign({},S.months,o.months||{}); S.foods=Object.assign({},S.foods,o.products||{});
      if(o.profile) S.profile=Object.assign({},S.profile,o.profile,FIXED);
      saveLocal(); render(); setSync('Backup restored');
    }catch(e){ setSync('That file is not a Health Tracker backup'); }
  };
  r.readAsText(file);
}

async function remindTick(){
  try{
    if(!SET.remind||!('Notification' in window)||Notification.permission!=='granted') return;
    const t=todayStr(), g=waterGoal(t), pace=waterPace(t,g.total);
    if(!pace||pace.frac<=0||pace.h>=pace.bed||pace.behind<8*OZ) return;
    const now=Date.now(); if(now-(SET.last||0)<(+SET.every||60)*60000) return;
    SET.last=now; saveSet();
    const reg=await navigator.serviceWorker.getRegistration();
    const body='You are about '+Math.round(pace.behind/OZ)+' oz behind. Have a glass now.';
    if(reg) reg.showNotification('Time for water 💧',{body,tag:'water',icon:'icon-192.png'});
  }catch(e){}
}
