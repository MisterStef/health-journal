<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Tracker</title>
<meta name="theme-color" content="#f1f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1210" media="(prefers-color-scheme: dark)">
<meta name="description" content="Private food, nutrition, water and weight tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-400.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-500.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:600 700;font-display:swap;src:url(fonts/inter-600.woff) format("woff")}
@font-face{font-family:"Inter Display";font-weight:600;font-display:swap;src:url(fonts/interdisplay-600.woff) format("woff")}
@font-face{font-family:"Inter Display";font-weight:700;font-display:swap;src:url(fonts/interdisplay-700.woff) format("woff")}
:root{
  --bg:#f1f4f2; --card:#ffffff; --tile:#f3f6f4; --ink:#0e1a17; --mute:#5a6864; --line:#e2e8e5;
  --accent:#0a6b56; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --warn:#c2452b; --warn-soft:#fbe9e3; --amber:#a66a00; --bar:#9ccdbf; --water:#1e7fd6; --water-soft:#dcebfa;
  --energy:#ffb627; --mint:#5ee0b0; --sky:#62b8ff; --ember:#ff6b4a;
  --hero:#0c2a24; --hero-2:#12443a; --hero-ink:#f1f6f4; --hero-mute:#9ebab1;
  --tank:#cfe5fa; --tank-2:#e3f0fc;
  --shadow:0 1px 0 rgba(14,26,23,.03),0 14px 30px -20px rgba(14,26,23,.25);
  --display:"Inter Display","Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0a1210; --card:#121c19; --tile:#18241f; --ink:#e9f0ed; --mute:#8fa39c; --line:#22302b;
    --accent:#4fd1a5; --accent-ink:#06261d; --accent-soft:#143229; --warn:#ff8a6b; --warn-soft:#3a1d15; --amber:#f0b44c; --bar:#2f6b5b; --water:#62b8ff; --water-soft:#14293c;
    --hero:#0f211c; --hero-2:#163a31; --tank:#143657; --tank-2:#102a44; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:760px;margin:0 auto;padding:14px 14px 150px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 14px}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.025em}
h2{font:600 18px/1.25 var(--display);margin:0 0 12px;letter-spacing:-.012em}
h3{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600}
.sync{font-size:12px;color:var(--mute);margin-top:3px}
.ic{display:block;flex:0 0 auto}
.ibtn{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0;transition:transform .15s var(--ease),background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn:disabled{opacity:.35}

/* bottom navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
nav button{flex:1 1 0;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mute);padding:4px 0 2px;font:500 11px/1.2 "Inter",system-ui,sans-serif;cursor:pointer;transition:color .2s}
nav .nic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .3s var(--ease),transform .3s var(--ease)}
nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
nav button[aria-selected="true"] .nic{background:var(--accent-soft);transform:scale(1.04)}
nav button:active .nic{transform:scale(.92)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:11px 18px;font-weight:600;display:inline-block;text-align:center;transition:transform .15s var(--ease),filter .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.water{background:var(--water);color:#fff}
@media (prefers-color-scheme: dark){.btn.water{color:#06203a}}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;transition:background .2s,color .2s,border-color .2s,transform .15s var(--ease)}
button.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.chip[data-act="mode"]{border-radius:12px}
.chip[data-act="mode"][aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.fav{display:inline-flex;gap:6px;align-items:center}
.chip.fav span{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px}
.datebar .lbl{text-align:center;flex:1;font:600 17px/1.2 var(--display);letter-spacing:-.01em}
.datebar .lbl span{display:block;font:400 12.5px/1.3 "Inter",system-ui,sans-serif;color:var(--mute);letter-spacing:0;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stat{background:var(--tile);border-radius:16px;padding:12px 13px}
.stat b{display:block;font:700 23px/1.15 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gt{background:var(--tile);border-radius:18px;padding:11px 10px 10px;min-width:0}
.gt label{font:600 12.5px/1.2 var(--display);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt input{background:var(--card);padding:8px 6px;text-align:center;font:700 20px/1.2 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;border-radius:12px}
.gt .goal{font-size:11.5px;color:var(--mute);text-align:center;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.gbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;width:0;transition:width .6s var(--ease)}
.gt.s label{color:#4d8f1f}.gt.s .gbar i{background:#7cc62f}
.gt.m label{color:#1f7fbf}.gt.m .gbar i{background:#3aaee8}
.gt.c label{color:#7a45d6}.gt.c .gbar i{background:#8d5cf0}
@media (prefers-color-scheme: dark){.gt.s label{color:#a6e65c}.gt.m label{color:#62c3f5}.gt.c label{color:#b48cff}}
.sbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.sbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.sbar i.mid{background:var(--amber)} .sbar i.low{background:var(--warn)}
.sp{padding:11px 0;border-top:1px solid var(--line)}
.sp:first-of-type{border-top:0}
.sp .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sp .top b{font:600 15px var(--display)} .sp .top span{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.sp .d{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.sp .w{font-size:11.5px;color:var(--mute);font-weight:400}
.stat span{font-size:12px;color:var(--mute);line-height:1.3;display:block;margin-top:3px}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.banner{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14.5px}
.warn{background:var(--warn-soft);border-radius:14px;padding:11px 13px;font-size:14px;margin-top:10px}
.food{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.food .n small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:1px}
.food .c{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.x{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:19px;line-height:1;padding:0;transition:background .2s}
.x:active{background:var(--tile)}
.ai{white-space:pre-wrap;line-height:1.6;margin-top:10px}
svg text{fill:var(--mute);font-size:11px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}

/* the day dial: calories, protein and water in one glance */
.card.hero{padding:0;overflow:hidden;border:0}
.hero-face{display:flex;align-items:center;gap:18px;padding:22px 18px;color:var(--hero-ink);background:radial-gradient(120% 90% at 0% 0%,var(--hero-2),var(--hero) 70%)}
.dial{position:relative;width:156px;height:156px;flex:0 0 auto}
.dial svg{display:block;width:100%;height:100%}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial-c b{font:700 30px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dial-c span{font-size:11.5px;color:var(--hero-mute);margin-top:4px}
.legend{flex:1;min-width:0;display:grid;gap:12px}
.lg{display:grid;grid-template-columns:10px 1fr;column-gap:9px;align-items:center}
.lg i{width:10px;height:10px;border-radius:50%}
.lg span{font-size:12px;color:var(--hero-mute)}
.lg b{grid-column:2;font:600 19px/1.15 var(--display);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.lg b small{font:400 12.5px "Inter",system-ui,sans-serif;color:var(--hero-mute);letter-spacing:0}
.hero-more{padding:12px 14px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px}
@media (max-width:350px){.dial{width:128px;height:128px}.dial-c b{font-size:25px}}

.nrow{display:grid;grid-template-columns:112px 1fr 104px;gap:10px;align-items:center;font-size:14px;margin:9px 0}
.nrow .track{position:relative;height:6px;border-radius:3px;background:var(--line)}
.nrow .fill{height:100%;border-radius:3px;background:var(--accent)}
.nrow .fill.over{background:var(--warn)}
.nrow .fill.info{background:var(--bar)}
.nrow .fill.near{background:var(--amber)}
.nrow .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5;border-radius:1px}
.nrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px}
.nrow .v b{color:var(--ink);font-size:14px}
.st{display:block;font-size:11px;font-weight:600;line-height:1.25}
.st.ok{color:var(--accent)} .st.near{color:var(--amber)} .st.over,.st.low{color:var(--warn)} .st.wait{color:var(--mute);font-weight:500}
.tgtgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:10px 0}
.tgtgrid div{background:var(--tile);border-radius:14px;padding:9px 11px;font-size:13px}
.tgtgrid b{display:block;font:600 16px/1.3 var(--display);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);line-height:1;padding:0}
.est{border-radius:16px;padding:12px;margin-top:10px;background:var(--tile)}
.est input{background:var(--card)}
.est .top{display:flex;gap:8px;align-items:center}
.est .macro{font-size:13px;color:var(--mute);margin-top:6px}

/* floating water capsule */
.dock{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;pointer-events:none}
body[data-view="water"] .dock,body[data-view="settings"] .dock{display:none}
.dock .in{max-width:760px;margin:0 auto;padding:0 14px;display:flex;justify-content:flex-end}
.cap{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px -12px rgba(14,26,23,.38)}
.capm{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:0 4px 0 0;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.capm b{font:600 15px var(--display)}
.cap .btn{border-radius:999px;white-space:nowrap}

/* undo toast */
.toast{position:fixed;left:50%;bottom:calc(138px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);white-space:nowrap;animation:rise .3s var(--ease) both}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:600;border-radius:999px;padding:7px 14px}
body[data-view="water"] .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
/* water tank */
.card.tank{position:relative;overflow:hidden;padding:0;min-height:250px}
.tank-fill{position:absolute;inset:0;background:var(--tank);will-change:transform}
.tank-fill .wave{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:16px;fill:var(--tank);animation:drift 7s linear infinite;will-change:transform}
.tank-fill .wave.w2{fill:var(--tank-2);animation-duration:11s;animation-direction:reverse;height:22px;z-index:-1}
@keyframes drift{to{transform:translateX(-50%)}}
.tank-c{position:relative;padding:22px 18px 18px}
.tank-n{font:700 58px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tank-n small{font:500 16px "Inter",system-ui,sans-serif;letter-spacing:0;color:var(--mute);margin-left:6px}
.tank-s{font:600 17px/1.3 var(--display);margin-top:10px}
.tank .note{color:var(--ink);opacity:.72}
.tank input{background:var(--card)}

.big{font:700 30px/1.15 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.big small{font:500 15px "Inter",system-ui,sans-serif;color:var(--mute);letter-spacing:0}
.big.pos{color:var(--accent)} .big.neg{color:var(--warn)}
.kpi{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi .big{font-size:44px;letter-spacing:-.035em}
.pill{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.journey{margin:16px 0 4px}
.journey .jt{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.journey .jf{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--mint));min-width:10px}

.wrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow span:last-child{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.scanner{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .bar{padding:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:#000}
.scanner .box{position:absolute;left:12%;right:12%;top:30%;height:26%;border:2px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tile);border:0;border-radius:16px;padding:12px 14px;color:var(--ink);text-align:left;transition:background .2s}
.toggle b{font:600 16px var(--display)}
.toggle small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px;line-height:1.4}
.toggle .car{color:var(--mute);transition:transform .35s var(--ease)}
.toggle[aria-expanded="true"] .car{transform:rotate(180deg)}
.collapse{margin-top:8px}
.collapse.reveal{animation:rise .4s var(--ease) both}

/* motion: values glide to their new position; one short entrance per tab change */
[data-anim]{transition:width .8s var(--ease),stroke-dashoffset 1s var(--ease),transform 1.1s var(--ease)}
#view.enter>*{animation:rise .45s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.05s}
#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div><h1>Health Tracker</h1><div id="sync" class="sync">Loading…</div></div><button class="ibtn" data-tab="settings" aria-label="Settings"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button></header>
  <div id="banner"></div>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="dock" id="dock"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="scanner" id="scanner" hidden><video id="scanvideo" playsinline muted></video><div class="box"></div><div class="bar"><span>Point at the barcode</span><button class="btn" data-act="stopscan">Cancel</button></div></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

/* ---------- calorie / goal math ---------- */
function ageNow(){
  const b=parse(S.profile.birthday), n=new Date(); let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--;
  return a;
}
function calc(){
  const p=S.profile, w=latestWeight();
  const age=ageNow();
  if(!(age && +p.height && w)) return null;
  const kg=w*0.45359237, cm=+p.height*2.54;
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.activity||1.375);
  const floor=p.sex==='m'?1500:1200;
  const raw=tdee-(+p.pace||0)*500;
  const target=Math.max(floor,Math.round(raw/10)*10);
  const limited = raw<floor;
  const bmiLo=18.5*Math.pow(+p.height*0.0254,2)/0.45359237, bmiHi=24.9*Math.pow(+p.height*0.0254,2)/0.45359237;
  return {w,bmr:Math.round(bmr),tdee:Math.round(tdee),target,limited,floor,bmiLo:Math.round(bmiLo),bmiHi:Math.round(bmiHi)};
}
function targetCal(){ const p=S.profile; if(+p.custom>0) return +p.custom; const c=calc(); return c?c.target:null; }

/* ---------- personal nutrient targets ----------
   Built for: male, 29, goal 215 lb, strength training 1-2 days/week, family history of high blood pressure and
   diabetes, blood pressure readings above ideal at visits, fatty liver, no supplements.
   Heart/liver-friendly pattern (Mediterranean/DASH style): protein high enough to protect muscle in a deficit,
   moderate fiber-rich carbs, mostly unsaturated fat, low added sugar and sodium. Vitamins/minerals use RDA/AI for men 19-50. */
function targets(){
  const kcal=targetCal()||2000, p=S.profile;
  const gkg=(+p.goal||latestWeight()||180)*0.45359237;
  const r5=x=>Math.round(x/5)*5;
  const protein=r5(1.6*gkg), fat=Math.round(0.30*kcal/9);
  const carbs=r5((kcal-4*protein-9*fat)/4);
  const T={};
  const range=(k,t,lo,hi)=>{ T[k]={ty:'range',t,lo,hi}; };
  const min=(k,t)=>{ T[k]={ty:'min',t}; };
  const max=(k,t,cap)=>{ T[k]={ty:'max',t,cap}; };
  range('protein',protein,r5(1.4*gkg),r5(2.0*gkg));
  range('carbs',carbs,r5(0.38*kcal/4),r5(0.50*kcal/4));
  range('fat',fat,Math.round(0.25*kcal/9),Math.round(0.35*kcal/9));
  min('fiber',Math.max(28,Math.round(14*kcal/1000)));
  max('sat',Math.round(0.07*kcal/9),Math.round(0.10*kcal/9));
  max('trans',0.5,2);
  min('omega3',1.6);
  max('addedSugar',25,36);
  max('sodium',1500,2300);
  max('caffeine',400,400);
  { const al=S.profile.alcoholLimit, lim=(al===undefined||al===null||al==='')?1:Math.max(0,+al||0); max('alcohol',lim,lim===0?0:lim+1); }
  min('calcium',1000); min('iron',8); min('magnesium',420); min('potassium',3400); min('zinc',11);
  min('vitA',900); min('vitC',90); min('vitD',15); min('vitE',15); min('vitK',120); min('b12',2.4);
  min('folate',400); min('b6',1.3); min('thiamin',1.2); min('riboflavin',1.3); min('niacin',16);
  return T;
}
/* status of one nutrient value: s = ok | wait | near | over | low */
function statusOf(k,v,isToday){
  const T=targets()[k]; if(!T) return null; v=+v||0;
  if(T.ty==='min'){
    if(v>=T.t) return {s:'ok',l:'Hit ✓'};
    if(isToday) return {s:'wait',l:'Building'};
    return v>=T.t*0.85?{s:'near',l:'Close'}:{s:'low',l:'Short'};
  }
  if(T.ty==='max'){
    if(v<=T.t) return {s:'ok',l:'Within limit ✓'};
    if(v<=T.cap) return {s:'near',l:'Near limit'};
    return {s:'over',l:'Over limit'};
  }
  if(v>T.hi) return {s:'near',l:'Above range'};
  if(v>=T.lo) return {s:'ok',l:'On target ✓'};
  return isToday?{s:'wait',l:'Building'}:{s:'low',l:'Under'};
}
function fmtN(n){ const a=Math.abs(n); return a>=100?String(Math.round(n)):(Math.round(n*10)/10).toString(); }
function targetText(k,u){
  const T=targets()[k]; if(!T) return '';
  if(T.ty==='min') return ` / ${fmtN(T.t)}`;
  if(T.ty==='max') return ` / ≤${fmtN(T.t)}`;
  return ` / ${fmtN(T.t)}`;
}

/* ---------- water goal: recalculated from what you have logged ---------- */
const WATER_RULES = [
  ['Baseline (body weight)', null, 'mL per kg of body weight: 20'],
  ['Calories eaten','cal',0.15],
  ['Protein','protein',3],
  ['Fiber','fiber',8],
  ['Sodium','sodium',0.15],
  ['Caffeine','caffeine',0.5],
  ['Added sugar','addedSugar',2],
  ['Alcohol','alcohol',250]
];
function waterGoal(date){
  const t=dayTotals(day(date)), w=latestWeight(), assumed=!w;
  const kg=(w||154)*0.45359237;
  const parts=[{l:'Baseline (body weight)',ml:20*kg}];
  WATER_RULES.slice(1).forEach(([l,k,m])=>parts.push({l,ml:m*t[k]}));
  const raw=parts.reduce((a,p)=>a+p.ml,0);
  const total=Math.min(5500,Math.max(1500,raw));
  return {parts,total,oz:total/OZ,assumed};
}
function waterPace(date,goalMl){
  if(date!==todayStr()) return null;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60;
  const wake=+S.profile.wake||7, bed=+S.profile.bed||23;
  const frac=Math.min(1,Math.max(0,(h-wake)/Math.max(1,bed-wake)));
  const expected=goalMl*frac, drunk=waterMl(day(date));
  return {frac,expected,behind:expected-drunk,h,bed,wake};
}

/* ---------- charts (inline SVG) ---------- */
function chart(vals,labels,opt={}){
  const nums=vals.filter(v=>v!=null);
  if(!nums.length) return '<div class="empty">Nothing logged in this range yet.</div>';
  const W=600,H=opt.h||130,L=34,R=8,T=8,B=20,n=vals.length;
  let lo=opt.min!=null?opt.min:Math.min(...nums), hi=opt.max!=null?opt.max:Math.max(...nums);
  if(opt.target!=null){ lo=Math.min(lo,opt.target); hi=Math.max(hi,opt.target); }
  if(opt.bar) lo=0;
  if(opt.min==null && !opt.bar){ const padv=(hi-lo)*0.15||1; lo-=padv; hi+=padv; }
  if(hi===lo) hi=lo+1;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const iw=W-L-R, slot=iw/n;
  const x=i=> opt.bar ? L+i*slot+slot/2 : L+(n===1?iw/2:i*iw/(n-1));
  let g='';
  const gid='cg'+(chart.n=(chart.n||0)+1);
  [lo,hi].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v*10)/10}</text>`; });
  if(opt.target!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--mute)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/><text x="${W-R}" y="${y(opt.target)-5}" text-anchor="end">${opt.tlabel||'goal'} ${Math.round(opt.target*10)/10}</text>`;
  if(opt.bar){
    vals.forEach((v,i)=>{ if(v==null) return; const bw=Math.max(3,Math.min(26,slot*0.62)), yy=Math.min(y(v),H-B-2), rx=Math.min(5,bw/2);
      const over = opt.over && opt.target!=null && v>opt.target*1.1;
      g+=`<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${H-B-yy}" rx="${rx}" fill="${over?'var(--warn)':(opt.color||'var(--accent)')}" ${over||opt.color?'':'fill-opacity=".75"'}/>`; });
  } else {
    let d='',pen=false,first=null,last=null;
    vals.forEach((v,i)=>{ if(v==null) return; if(first==null) first=i; last=i; d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen=true; });
    if(last>first) g+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".24"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${d}L${x(last).toFixed(1)} ${H-B} L${x(first).toFixed(1)} ${H-B}Z" fill="url(#${gid})"/>`;
    g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const many=nums.length>20;
    vals.forEach((v,i)=>{ if(v==null) return; if(i===last) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>`; else if(!many) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="var(--accent)"/>`; });
  }
  g+=`<text x="${L}" y="${H-4}">${esc(labels[0])}</text><text x="${W-R}" y="${H-4}" text-anchor="end">${esc(labels[n-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'chart')}">${g}</svg>`;
}

/* ---------- motion: bars, rings and numbers glide from their previous value ---------- */
const PREV=new Map(), PREVN=new Map();
const calm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function motion(fresh){
  if(calm()) return;
  if(fresh){ [...PREV.keys()].forEach(k=>{ if(!k.startsWith('dock')) PREV.delete(k); }); PREVN.clear(); }
  const jobs=[];
  document.querySelectorAll('[data-anim]').forEach(el=>{
    const k=el.dataset.anim, p=el.dataset.prop||'width', to=el.style.getPropertyValue(p);
    const from=PREV.has(k)?PREV.get(k):el.dataset.from; PREV.set(k,to);
    if(from!=null && from!==to) jobs.push([el,p,from,to]);
  });
  if(jobs.length){
    jobs.forEach(([el,p,from])=>{ el.style.transition='none'; el.style.setProperty(p,from); });
    void document.body.offsetWidth;
    jobs.forEach(([el,p,,to])=>{ el.style.transition=''; el.style.setProperty(p,to); });
  }
  document.querySelectorAll('[data-count]').forEach(el=>{
    const k=el.dataset.ck, to=+el.dataset.count, dec=+el.dataset.dec||0, from=PREVN.has(k)?PREVN.get(k):0; PREVN.set(k,to);
    if(from===to||!isFinite(to)) return;
    const t0=performance.now(), dur=600, f=10**dec;
    const step=t=>{ if(!el.isConnected) return; const x=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-x,3); el.textContent=(Math.round((from+(to-from)*e)*f)/f).toFixed(dec); if(x<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function renderDock(fresh){
  const g=waterGoal(S.date), drunk=waterMl(day(S.date)), pct=Math.min(100,drunk/g.total*100);
  $('#dock').innerHTML=`<div class="in"><div class="cap"><button class="capm" data-tab="water" aria-label="Open water tracker"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">${ringArc(17,13,4,'var(--water)',pct,'dockring')}</svg><span><b>${Math.round(drunk/OZ)}</b> / ${Math.round(g.oz)} oz${S.date!==todayStr()?' · '+esc(fmtDate(S.date)):''}</span></button>
    <button class="btn water small" data-act="water" data-oz="8">+8 oz</button></div></div>`;
  motion(fresh===true);
}

function renderBanner(){
  const t=todayStr(), dom=+t.slice(8), ym=t.slice(0,7);
  let msg='',target=null;
  if(dom>=26){ msg=`The month is almost over. Ready to look back on ${fmtMonth(ym)}?`; target=ym; }
  else if(dom<=3){ target=addMonths(ym,-1); if(Object.keys(S.days).some(k=>k.startsWith(target))) msg=`A new month. Take a few minutes to review ${fmtMonth(target)}.`; else target=null; }
  const b=$('#banner');
  if(!target || S.tab==='progress'){ b.innerHTML=''; return; }
  b.innerHTML=`<div class="banner"><span>${esc(msg)}</span><button class="btn small" data-act="gomonth" data-m="${target}">Open Progress</button></div>`;
}

function dateBar(){
  const t=todayStr();
  return `<div class="datebar"><button class="ibtn" data-act="prev" aria-label="Previous day">${ic('chevL',18)}</button>
    <div class="lbl">${S.date===t?'Today':esc(fmtDate(S.date))}${S.date===t?`<span>${esc(fmtDate(S.date))}</span>`:''}</div>
    ${S.date!==t?'<button class="btn ghost small" data-act="today">Today</button>':''}
    <button class="ibtn" data-act="next" aria-label="Next day" ${S.date>=t?'disabled':''}>${ic('chevR',18)}</button></div>`;
}

function vBody(){
  const d=day(S.date), ds=rangeDates(30), labels=ds.map(k=>fmtDate(k).replace(/^\w+, /,''));
  const wt=ds.map(k=>S.days[k]?.weight?+S.days[k].weight:null);
  const p=S.profile, start=+p.weight, goal=+p.goal, cur=latestWeight()||start;
  const lost=start-cur, jp=Math.max(0,Math.min(100,(start-cur)/(start-goal)*100));
  const journey=`<div class="card"><div class="kpi"><div><div class="note">Current weight</div><div class="big"><span data-count="${cur}" data-ck="curw" data-dec="1">${cur.toFixed(1)}</span> <small>lb</small></div></div>
      <span class="pill">${lost>0.05?`${r1(lost)} lb down`:lost<-0.05?`${r1(-lost)} lb up`:'Starting line'} · ${r1(Math.max(0,cur-goal))} to go</span></div>
    <div class="journey"><div class="jt"><div class="jf" data-anim="journey" data-from="0%" style="width:${jp.toFixed(1)}%"></div></div><div class="ends"><span>Start ${start} lb</span><span>Goal ${goal} lb</span></div></div></div>`;
  return dateBar()+journey+`
  <div class="card"><h2>Log today’s weight</h2>
    <label for="f-weight">Weight (lb)</label><input id="f-weight" data-f="weight" type="number" inputmode="decimal" step="0.1" min="0" value="${esc(d.weight??'')}" placeholder="optional">
    <div class="note" style="margin-top:8px">Weigh yourself at a similar time each day, such as first thing in the morning. Day-to-day swings of a few pounds are normal water and salt changes, so watch the trend.</div></div>
  <div class="card"><h3>Weight, last 30 days (lb)</h3>${chart(wt,labels,{label:'Weight over time',fmt:v=>Math.round(v*10)/10})}</div>`;
}

/* ----- food ----- */
function mealGuess(){ const h=new Date().getHours(); return h<10?'Breakfast':h<14?'Lunch':h<17?'Snack':h<21?'Dinner':'Snack'; }
function favorites(){
  const cut=addDays(todayStr(),-90), m={};
  Object.keys(S.days).filter(k=>k>=cut).forEach(k=>(S.days[k].foods||[]).forEach(f=>{
    const key=(f.name||'').trim().toLowerCase(); if(!key) return;
    const e=m[key]||(m[key]={name:f.name.trim(),food:f,n:0,last:k}); e.n++; if(k>=e.last){e.last=k;e.food=f;}
  }));
  return Object.values(m).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,12);
}
function savedProducts(){ return Object.values(S.foods).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,12); }
function macroLine(o){ return `${Math.round(o.cal||0)} cal · P ${r1(o.protein||0)}g · C ${r1(o.carbs||0)}g · F ${r1(o.fat||0)}g`; }
function foodMacro(f){ return macroLine({cal:f.cal,protein:fval(f,'protein'),carbs:fval(f,'carbs'),fat:fval(f,'fat')}); }

function thumbs(list,kind){
  return list.length?`<div class="thumbs">${list.map((f,i)=>`<div><img src="${f.url}" alt="Photo ${i+1}"><button data-act="rmphoto" data-kind="${kind}" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div>`:'';
}
function fileBtns(kind,multi){
  return `<span class="btn ghost small filebtn">Take photo<input type="file" accept="image/*" capture="environment" data-file="${kind}"></span>
          <span class="btn ghost small filebtn">Choose photo<input type="file" accept="image/*" data-file="${kind}" ${multi?'multiple':''}></span>`;
}

function addPanel(){
  const dr=S.draft, busy=S.est&&S.est.busy;
  const modes=[['describe','Photo / describe'],['label','Barcode / label'],['manual','Manual']];
  let body='';
  if(S.addMode==='describe'){
    body=`<label for="d-text">Describe what you ate (and add a photo if you like)</label>
      <textarea id="d-text" data-draft="text" placeholder="e.g. two scrambled eggs cooked in butter, one slice of whole wheat toast, black coffee">${esc(dr.text)}</textarea>
      ${thumbs(dr.files,'meal')}
      <div class="row" style="margin-top:8px">${fileBtns('meal',true)}<button class="btn" data-act="estimate" ${busy?'disabled':''}>Estimate nutrition</button></div>
      <div class="note" style="margin-top:6px">Claude looks at the photo and your description and estimates every nutrient. Mention hidden extras like oil, butter or dressing for a better estimate.</div>`;
  } else if(S.addMode==='label'){
    body=`<div class="note" style="margin-bottom:8px">Scan the barcode to look the product up. If it is not in the database, photograph the nutrition label and Claude reads it. Products you add are saved, so next time it is one tap.</div>
      <div class="row"><button class="btn" data-act="scan">Scan barcode</button>${fileBtns('label',false)}</div>
      ${thumbs(dr.label?[dr.label]:[],'label')}
      <div class="two" style="margin-top:10px">
        <div><label for="d-bar">Barcode number</label><input id="d-bar" data-draft="barcode" inputmode="numeric" value="${esc(dr.barcode)}" placeholder="digits under the barcode"></div>
        <div style="align-self:end"><button class="btn" data-act="readlabel" ${busy?'disabled':''}>Look up / read label</button></div>
      </div>`;
  } else {
    body=`<form id="foodform" class="row" style="flex-wrap:nowrap">
      <input id="fname" class="grow" placeholder="What did you eat?" autocomplete="off" aria-label="Food name">
      <input id="fcal" type="number" inputmode="numeric" min="0" placeholder="Cal" style="width:90px" aria-label="Calories">
      <input id="falc" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Drinks" style="width:84px" aria-label="Alcoholic drinks">
      <button class="btn" type="submit">Add</button></form>
      <div class="note" style="margin-top:6px">Manual entries only count calories, plus alcoholic drinks if you enter them. Use photo or label for full nutrients.</div>`;
  }
  return `<div class="row" style="margin-bottom:10px">${modes.map(([k,l])=>`<button class="chip" data-act="mode" data-m="${k}" aria-pressed="${S.addMode===k}">${l}</button>`).join('')}</div>${body}`;
}

function estPanel(){
  const e=S.est; if(!e) return '';
  if(e.busy) return `<div class="card"><span class="spin"></span>${esc(e.msg||'Working on it…')}</div>`;
  if(e.error) return `<div class="card"><div class="warn" style="margin:0">${esc(e.error)}</div><div class="row" style="margin-top:8px"><button class="btn ghost small" data-act="estclear">Dismiss</button></div></div>`;
  if(!e.items||!e.items.length) return '';
  return `<div class="card"><h2>Review and add</h2>
    <div class="note">${e.src==='barcode'?'Found in your saved products.':e.src==='label'?'Read from the label. Check it looks right.':'These are estimates, so adjust servings if a portion looks off.'} Adding to <b>${esc(S.foodMeal||mealGuess())}</b> on ${esc(fmtDate(S.date))}.</div>
    ${e.items.map((it,i)=>`<div class="est"><div class="top"><input class="grow" data-ei="${i}" data-ef="name" value="${esc(it.name)}" aria-label="Food name"><label style="margin:0;white-space:nowrap">× <input type="number" step="0.25" min="0.25" data-ei="${i}" data-ef="qty" value="${it.qty}" style="width:70px;display:inline-block" aria-label="Servings"></label></div>
      <div class="macro">${esc(it.serving_desc||'1 serving')} → ${macroLine(scaled(it))}</div>
      ${it.notes?`<div class="note">${esc(it.notes)}</div>`:''}
      <div class="row sb" style="margin-top:6px"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" data-ei="${i}" data-ef="save" ${it.save?'checked':''}> Save to my products</label><button class="btn small" data-act="estadd" data-i="${i}">Add</button></div></div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn" data-act="estaddall">Add all (${e.items.length})</button><button class="btn ghost" data-act="estclear">Discard</button></div></div>`;
}
function scaled(it){ const q=+it.qty||1, o={}; NKEYS.forEach(k=>o[k]=(+it[k]||0)*q); return o; }

function vFood(){
  const d=day(S.date), eaten=Math.round(dayCals(d)), tgt=targetCal();
  const meal=S.foodMeal||mealGuess();
  const TG=targets(), tot0=dayTotals(d), wg=waterGoal(S.date), drunk=waterMl(d), goalC=tgt||2000, left=goalC-eaten;
  const ring=`<div class="hero-face"><div class="dial"><svg viewBox="0 0 156 156" role="img" aria-label="${eaten} of ${goalC} calories, ${Math.round(tot0.protein)} of ${TG.protein.t} grams protein, ${Math.round(drunk/OZ)} of ${Math.round(wg.oz)} ounces water">
      ${ringArc(78,70,11,left<0?'var(--ember)':'var(--energy)',eaten/goalC*100,'d-cal')}${ringArc(78,55,11,'var(--mint)',tot0.protein/TG.protein.t*100,'d-pro')}${ringArc(78,40,11,'var(--sky)',drunk/wg.total*100,'d-wat')}</svg>
      <div class="dial-c"><b data-count="${Math.abs(left)}" data-ck="left">${Math.abs(left)}</b><span>${left>=0?'cal left':'cal over'}</span></div></div>
    <div class="legend">
      <div class="lg"><i style="background:${left<0?'var(--ember)':'var(--energy)'}"></i><span>Calories</span><b>${eaten}<small> / ${goalC}</small></b></div>
      <div class="lg"><i style="background:var(--mint)"></i><span>Protein</span><b>${Math.round(tot0.protein)}<small> / ${TG.protein.t} g</small></b></div>
      <div class="lg"><i style="background:var(--sky)"></i><span>Water</span><b>${Math.round(drunk/OZ)}<small> / ${Math.round(wg.oz)} oz</small></b></div>
    </div></div>`;
  const favs=favorites(), prods=savedProducts();
  const groups=MEALS.map(m=>{
    const items=(d.foods||[]).filter(f=>f.meal===m); if(!items.length) return '';
    return `<div style="margin-top:8px"><h3>${m} · ${Math.round(items.reduce((a,f)=>a+(+f.cal||0),0))} cal</h3>${items.map(f=>`<div class="food"><div class="n">${esc(f.name)}${f.qty&&f.qty!==1?` (×${f.qty})`:''}<small>${f.n&&Object.keys(f.n).length?foodMacro(f):'calories only'}</small></div><div class="c">${Math.round(+f.cal||0)}</div><button class="x" data-act="delfood" data-id="${f.id}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}</div>`;
  }).join('');
  const tot=dayTotals(d), open=S.open.nutr;
  const nutr=`<button class="toggle" data-act="toggle" data-k="nutr" aria-expanded="${open}"><span><b>Nutrients</b><small>${open?'Tap to collapse':esc(nutrSummary(tot))}</small></span><span class="car">${ic('chevD',18)}</span></button>${open?`<div class="collapse${S.rev==='nutr'?' reveal':''}">${nutrBody()}</div>`:''}`;
  return dateBar()+`<div class="card hero">${ring}<div class="hero-more">${nutr}</div></div>
  <div class="card"><h2>Add food</h2>
    <div class="row" style="margin-bottom:10px">${MEALS.map(m=>`<button class="chip" data-act="meal" data-m="${m}" aria-pressed="${meal===m}">${m}</button>`).join('')}</div>
    ${addPanel()}
  </div>
  ${estPanel()}
  ${(favs.length||prods.length)?`<div class="card"><h3>Quick add</h3><div class="chips">${prods.map(p=>`<button class="chip fav" data-act="prod" data-id="${esc(p.id)}">${ic('box',14)} ${esc(p.name)} <span>${Math.round(p.cal||0)}</span></button>`).join('')}${favs.map((f,i)=>`<button class="chip fav" data-act="fav" data-i="${i}">${esc(f.name)} <span>${Math.round(+f.food.cal||0)}</span></button>`).join('')}</div></div>`:''}
  <div class="card"><h2>Today’s log</h2>${groups||'<div class="empty">Nothing logged for this day yet.</div>'}</div>`;
}

/* ----- nutrients (collapsible, top of Food tab) ----- */
function nutrSummary(t){
  const T=targets(), isToday=S.date===todayStr();
  const warn=['sat','trans','addedSugar','sodium','caffeine','alcohol'].map(k=>[k,statusOf(k,t[k],isToday)]).filter(([k,s])=>s&&(s.s==='near'||s.s==='over')).map(([k,s])=>DEFS.find(d=>d.k===k).l.toLowerCase()+(s.s==='over'?' over':' high'));
  return `Protein ${Math.round(t.protein)}/${T.protein.t} g · Carbs ${Math.round(t.carbs)}/${T.carbs.t} g · Fat ${Math.round(t.fat)}/${T.fat.t} g${warn.length?' · ⚠ '+warn.join(', '):''}`;
}
function nutrBody(){
  const d=day(S.date), t=dayTotals(d), fl=d.foods||[];
  const partial=fl.filter(f=>!f.n||!Object.keys(f.n).length).length;
  const sections=[...new Set(DEFS.map(x=>x.g))];
  const isToday=S.date===todayStr(), TT=targets();
  const rows=g=>DEFS.filter(x=>x.g===g).map(x=>{
    const v=t[x.k], T=TT[x.k], st=T?statusOf(x.k,v,isToday):null;
    let bar='';
    if(T){
      const scale=(T.ty==='range'?T.hi:T.ty==='max'?T.cap:T.t)||1, w=Math.min(100,v/scale*100), tick=Math.min(98,T.t/scale*100);
      const cls=!st?'info':st.s==='ok'?'':st.s==='near'?'near':st.s==='wait'?'info':'over';
      bar=`<div class="fill ${cls}" data-anim="n-${x.k}" data-from="0%" style="width:${w.toFixed(1)}%"></div><i class="tick" style="left:${tick}%"></i>`;
    }
    return `<div class="nrow"><div><span>${x.l}</span>${st?`<small class="st ${st.s}">${st.l}</small>`:''}</div><div class="track">${bar}</div><span class="v"><b>${fmtN(v)}</b>${T?esc(targetText(x.k)):''} ${x.u}</span></div>`;
  }).join('');
  const dayGroups=new Set(); fl.forEach(f=>(f.groups||[]).forEach(g=>dayGroups.add(g)));
  const plants=weekPlants(S.date);
  return (fl.length?'':'<div class="empty">Log food to see nutrients here.</div>')+
  (partial?`<div class="warn" style="margin:8px 0">${partial} entr${partial>1?'ies have':'y has'} calories only, so these totals may be low.</div>`:'')+
  (()=>{ const T=targets(), cal=targetCal(); return `<div class="note" style="margin-top:6px"><b>Your daily targets</b> (for ${cal} calories). The tick on each bar marks the target.</div>
  <div class="tgtgrid"><div><span class="note">Protein</span><b>${T.protein.t} g</b><span class="note">${T.protein.lo}–${T.protein.hi} g ok</span></div>
  <div><span class="note">Carbs</span><b>${T.carbs.t} g</b><span class="note">${T.carbs.lo}–${T.carbs.hi} g ok</span></div>
  <div><span class="note">Fat</span><b>${T.fat.t} g</b><span class="note">${T.fat.lo}–${T.fat.hi} g ok</span></div>
  <div><span class="note">Fiber</span><b>${T.fiber.t}+ g</b><span class="note">at least</span></div>
  <div><span class="note">Saturated fat</span><b>≤ ${T.sat.t} g</b><span class="note">under 7% of cal</span></div>
  <div><span class="note">Added sugar</span><b>≤ ${T.addedSugar.t} g</b><span class="note">limit</span></div>
  <div><span class="note">Sodium</span><b>≤ ${T.sodium.t} mg</b><span class="note">hard cap ${T.sodium.cap}</span></div>
  <div><span class="note">Caffeine</span><b>≤ ${T.caffeine.t} mg</b><span class="note">limit</span></div>
  <div><span class="note">Alcohol</span><b>${T.alcohol.t?`≤ ${T.alcohol.t} drink${T.alcohol.t===1?'':'s'}`:'None'}</b><span class="note">per day, set in Settings</span></div></div>`; })()+
  sections.map(g=>`<div style="margin-top:14px"><h3>${g}</h3>${rows(g)}${g==='Alcohol'?alcoholWeek():''}</div>`).join('')+
  `<div style="margin-top:14px"><h3>Food variety</h3>
    <div class="row sb" style="margin-bottom:6px"><span><b>${dayGroups.size}</b> of ${FOOD_GROUPS.length} food groups today</span><span><b>${plants.length}</b> / 30 different plants this week</span></div>
    <div class="chips">${FOOD_GROUPS.map(g=>`<span class="chip ${dayGroups.has(g)?'on':''}">${g}</span>`).join('')}</div>
    ${plants.length?`<div class="note" style="margin-top:8px">This week: ${esc(plants.join(', '))}</div>`:'<div class="note" style="margin-top:8px">Plants include vegetables, fruit, whole grains, beans, nuts, seeds, herbs and spices. Eating around 30 different ones a week is a common variety goal for gut health.</div>'}</div>
  <div class="note" style="margin-top:14px">How these were set: protein is 1.6 g per kg of your goal weight (you strength train 1–2 days a week and are in a calorie deficit); fat is about 30% of calories and mostly unsaturated; carbs are the moderate, fiber-rich remainder; fiber is 14 g per 1,000 calories; saturated fat stays under 7% of calories; added sugar under 25 g; sodium under 1,500 mg, the American Heart Association’s ideal limit when blood pressure runs high, with 2,300 mg as the hard cap. Vitamins and minerals use recommended intakes for men 19–50. Because of your family history, blood pressure readings and fatty liver, please have your doctor or a registered dietitian confirm these, including alcohol, which this app does not track. Photo estimates are approximate.</div>`;
}
function alcoholWeek(){
  let tot=0, dry=0; for(let i=0;i<7;i++){ const a=dayTotals(S.days[addDays(S.date,-i)]).alcohol; tot+=a; if(a<=0) dry++; }
  return `<div class="note" style="margin-top:6px">Last 7 days: <b>${fmtN(tot)}</b> drink${Math.abs(tot-1)<0.05?'':'s'}, ${dry} alcohol-free day${dry===1?'':'s'}. One drink is 12 oz of regular beer, 5 oz of wine or 1.5 oz of liquor (14 g of pure alcohol).</div>`;
}
function weekPlants(date){
  const set=new Map();
  for(let i=0;i<7;i++){ const dd=S.days[addDays(date,-i)]; ((dd&&dd.foods)||[]).forEach(f=>(f.plants||[]).forEach(p=>{ const k=String(p).trim().toLowerCase(); if(k) set.set(k,k); })); }
  return [...set.keys()].sort();
}

/* ----- water ----- */
function vWater(){
  const d=day(S.date), g=waterGoal(S.date), drunk=waterMl(d), left=g.total-drunk;
  const pace=waterPace(S.date,g.total);
  const R=44,C=2*Math.PI*R,pct=Math.min(1,drunk/g.total);
  let paceMsg='';
  if(pace){
    if(drunk>=g.total) paceMsg='You have hit today’s water goal.';
    else if(pace.h>=pace.bed) paceMsg=`The day is winding down. ${Math.round(left/OZ)} oz to go if you can.`;
    else if(pace.behind>0.5*OZ*4) paceMsg=`You are about ${Math.round(pace.behind/OZ)} oz behind pace. Have a glass now.`;
    else paceMsg='You are on pace. Keep sipping.';
  }
  const bd=g.parts.map(p=>`<div class="wrow"><span>${p.l}</span><span>${Math.round(p.ml/OZ*10)/10} oz</span></div>`).join('');
  const WAVE='<path d="M0 8 Q75 0 150 8 T300 8 T450 8 T600 8 T750 8 T900 8 T1050 8 T1200 8 V16 H0Z"/>';
  return dateBar()+`<div class="card tank"><div class="tank-fill" data-anim="tank" data-prop="transform" data-from="translateY(100%)" style="transform:translateY(${(100-pct*100).toFixed(1)}%)"><svg class="wave w2" viewBox="0 0 1200 16" preserveAspectRatio="none" aria-hidden="true">${WAVE}</svg><svg class="wave" viewBox="0 0 1200 16" preserveAspectRatio="none" aria-hidden="true">${WAVE}</svg></div>
    <div class="tank-c"><div class="tank-n" role="img" aria-label="${Math.round(drunk/OZ)} of ${Math.round(g.oz)} ounces"><span data-count="${Math.round(drunk/OZ)}" data-ck="woz">${Math.round(drunk/OZ)}</span><small>of ${Math.round(g.oz)} oz</small></div>
    <div class="tank-s">${left>0?Math.round(left/OZ)+' oz to go':'Goal reached'}</div><div class="note">${esc(paceMsg)}</div>
    <div class="row" style="margin-top:18px">${[8,12,16,24].map(n=>`<button class="btn water small" data-act="water" data-oz="${n}">+${n} oz</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input id="w-custom" type="number" inputmode="decimal" min="0" placeholder="Other amount (oz)" style="width:170px" aria-label="Custom ounces"><button class="btn ghost small" data-act="watercustom">Add</button><button class="btn ghost small" data-act="undolast" ${(d.water||[]).length?'':'disabled'}>Remove last drink</button></div>
    <div class="note" style="margin-top:10px">Log any fluid you drink. Plain water is best.</div></div>
    ${g.assumed?'<div class="tank-c" style="padding-top:0"><div class="warn">Add your weight in the Body tab for an accurate baseline.</div></div>':''}</div>
  <div class="card"><h2>How your goal is calculated</h2>
    ${bd}<div class="wrow"><span><b>Today’s water goal</b></span><span><b>${Math.round(g.oz)} oz</b> (${(g.total/1000).toFixed(1)} L)</span></div>
    <div class="note" style="margin-top:8px">The goal is recalculated every time you add or remove food. Baseline is 20 mL per kg of body weight; then add 0.15 mL per calorie, 3 mL per g protein, 8 mL per g fiber, 0.15 mL per mg sodium, 0.5 mL per mg caffeine 2 mL per g added sugar and 250 mL (about 8 oz) per alcoholic drink, since alcohol makes you lose extra water (kept between 1.5 and 5.5 L). The drink itself does not count toward your water. This is a practical estimate, not medical advice. Exercise, heat and illness raise your needs, and if you have kidney, heart or other conditions, follow your doctor’s fluid advice instead.</div></div>
  <div class="card"><h2>Today’s drinks</h2>${(d.water||[]).length?(d.water||[]).slice().reverse().map(w=>`<div class="food"><div class="n">${Math.round(w.ml/OZ*10)/10} oz<small>${new Date(w.t||Date.now()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small></div><button class="x" data-act="delwater" data-id="${w.id}" aria-label="Remove">×</button></div>`).join(''):'<div class="empty">Nothing logged yet.</div>'}</div>

}

/* ----- calorie balance: food eaten vs calories burned ----- */
function burnFor(date){
  const d=S.days[date]||{}, c=calc(); if(!c) return null;
  if(+d.burned>0) return {kcal:+d.burned,basis:'Total burned you entered (Samsung Health)',real:true};
  if(+d.active>0) return {kcal:c.bmr+(+d.active),basis:'Resting burn (estimated) + active calories you entered',real:true};
  return {kcal:c.tdee,basis:'Estimated from your activity level (no activity entered)',real:false};
}
function dayBalance(date){
  const c=calc(); if(!c) return null;
  const b=burnFor(date), eaten=Math.round(dayCals(day(date)));
  const tdef=(+S.profile.pace||0)*500;
  const burn=Math.round(b.kcal), allow=Math.max(c.floor,Math.round(burn-tdef));
  return {burn,basis:b.basis,real:b.real,eaten,deficit:burn-eaten,tdef,allow,left:allow-eaten,floor:c.floor,bmr:c.bmr};
}
function weekBalance(){
  const today=todayStr(), end=S.date===today?addDays(today,-1):S.date;
  const rows=[]; for(let i=6;i>=0;i--){ const k=addDays(end,-i); rows.push({k,b:dayBalance(k),logged:hasFood(S.days[k])}); }
  const used=rows.filter(r=>r.logged&&r.b), n=used.length;
  const avgDef=n?used.reduce((a,r)=>a+r.b.deficit,0)/n:null;
  const under=used.filter(r=>r.b.eaten<r.b.floor).length;
  const ws=[]; for(let i=13;i>=0;i--){ const k=addDays(end,-i); const w=S.days[k]&&S.days[k].weight; if(w) ws.push([k,+w]); }
  let actual=null;
  if(ws.length>=2){ const span=(parse(ws[ws.length-1][0])-parse(ws[0][0]))/86400000; if(span>=5) actual=(ws[0][1]-ws[ws.length-1][1])/span*7; }
  return {rows,n,avgDef,estLb:avgDef!=null?avgDef*7/3500:null,under,actual,end};
}
function verdict(wb,tdef){
  if(wb.n<3) return {tone:'',title:'Not enough days yet',msg:`Log food for at least 3 of the last 7 days for a reliable read. You have ${wb.n}.`};
  const a=wb.avgDef;
  if(wb.under>=2) return {tone:'warn',title:'Eating below the minimum',msg:`On ${wb.under} days you ate under ${wb.rows.find(r=>r.b)?.b.floor} calories. A bigger deficit that way is not healthy or sustainable. Eat at least your minimum, even if it slows the numbers.`};
  if(tdef===0) return Math.abs(a)<=150?{tone:'ok',title:'On track to maintain',msg:'Your intake is close to what you burn.'}:{tone:'',title:a>0?'Running a deficit':'Running a surplus',msg:`You average ${Math.round(Math.abs(a))} cal/day ${a>0?'under':'over'} what you burn.`};
  const r=a/tdef;
  if(r>=0.9) return {tone:'ok',title:'On track',msg:`You are averaging a ${Math.round(a)} cal/day deficit against a goal of ${Math.round(tdef)}. ${r>1.4?'That is well ahead of plan. Make sure you are eating enough and feeling OK.':'Nice and steady.'}`};
  if(r>=0.5) return {tone:'',title:'Slightly behind',msg:`Averaging a ${Math.round(a)} cal/day deficit against ${Math.round(tdef)}. About ${Math.round(tdef-a)} cal/day more (a snack or a 20-minute walk) would close the gap.`};
  return {tone:'warn',title:'Behind pace',msg:a>0?`Averaging only a ${Math.round(a)} cal/day deficit against ${Math.round(tdef)}.`:`You are averaging about ${Math.round(-a)} cal/day over what you burn.`};
}
function actGoals(){ const p=S.profile; return {steps:+p.stepGoal||6000,min:+p.minGoal||90,cal:+p.calGoal||500}; }

/* ---------- sleep: score built from published sleep-quality criteria ---------- */
const hmin=s=>{ if(!s||!/^\d{1,2}:\d{2}$/.test(String(s))) return null; const [a,b]=String(s).split(':').map(Number); return a*60+b; };
const fmtDur=m=>{ m=Math.round(m); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' m'; };
const fmtClock=m=>{ m=((Math.round(m)%1440)+1440)%1440; const h24=Math.floor(m/60), mm=m%60; return ((h24%12)||12)+':'+String(mm).padStart(2,'0')+(h24<12?' AM':' PM'); };
const clamp01=x=>Math.max(0,Math.min(1,x));
function sleepCalc(date){
  const s=(S.days[date]||{}).sleep; if(!s) return null;
  const b=hmin(s.bed), w=hmin(s.wake); if(b==null||w==null) return null;
  let inBed=w-b; if(inBed<=0) inBed+=1440; if(inBed<60||inBed>1080) return null;
  const blank=v=>v===''||v==null, aw=blank(s.awake)?null:Math.max(0,+s.awake||0);
  const deep=+s.deep||0, rem=+s.rem||0, light=+s.light||0, st=deep+rem+light;
  let asleep,awake;
  if(st>0){ asleep=Math.min(st,inBed); awake=aw!=null?aw:Math.max(0,inBed-asleep); }
  else if(aw!=null){ awake=Math.min(aw,inBed); asleep=inBed-awake; }
  else { asleep=inBed; awake=null; }
  const staged=st>0&&(!blank(s.deep)||!blank(s.rem));
  return {date,bed:b,wake:w,inBed,asleep,awake,eff:awake!=null?asleep/inBed:null,
    deepPct:staged?deep/asleep*100:null, remPct:staged?rem/asleep*100:null, mid:((b+720)%1440)+inBed/2};
}
/* weights: duration 35, efficiency 20, regularity 20, architecture 15, awake time 10. Missing factors are left out and the rest re-weighted. */
function sleepScore(date){
  const c=sleepCalc(date); if(!c) return null;
  const lin=(x,a,b)=>clamp01((x-a)/(b-a))*100, parts=[];
  const hrs=c.asleep/60;
  parts.push({k:'dur',l:'Duration',w:35,s:hrs<7?lin(hrs,4,7):hrs<=9?100:Math.max(50,100-25*(hrs-9)),v:fmtDur(c.asleep),d:'Adults need 7 to 9 hours (AASM and Sleep Research Society consensus).'});
  if(c.eff!=null) parts.push({k:'eff',l:'Efficiency',w:20,s:lin(c.eff*100,65,90),v:Math.round(c.eff*100)+'%',d:'Share of time in bed spent asleep. 85% or more is good (National Sleep Foundation).'});
  const dates=[]; for(let i=0;i<7;i++) dates.push(addDays(date,-i));
  const mids=dates.map(sleepCalc).filter(Boolean).map(x=>x.mid);
  if(mids.length>=3){ const mean=mids.reduce((a,b)=>a+b,0)/mids.length, sd=Math.sqrt(mids.reduce((a,b)=>a+(b-mean)**2,0)/mids.length);
    parts.push({k:'reg',l:'Regularity',w:20,s:100-lin(sd,30,120),v:'±'+Math.round(sd)+' min',d:`How much the middle of your sleep moves night to night (last ${mids.length} nights). Under 30 minutes is steady; irregular timing is linked to poorer health.`}); }
  if(c.deepPct!=null){ const f=(x,lo,hi)=>x>=lo&&x<=hi?100:x<lo?Math.max(0,x/lo*100):Math.max(40,100-(x-hi)*4);
    const sc=[f(c.deepPct,13,23)]; if(c.remPct!=null) sc.push(f(c.remPct,18,28));
    parts.push({k:'arch',l:'Sleep stages',w:15,s:sc.reduce((a,b)=>a+b,0)/sc.length,v:`Deep ${Math.round(c.deepPct)}% · REM ${Math.round(c.remPct||0)}%`,d:'Typical adults get about 13 to 23% deep and 18 to 28% REM. Wrist-band stage tracking is only a rough guide.'}); }
  if(c.awake!=null) parts.push({k:'waso',l:'Time awake',w:10,s:100-lin(c.awake,20,90),v:Math.round(c.awake)+' min',d:'Minutes awake during the night. 20 or fewer is good (National Sleep Foundation).'});
  const W=parts.reduce((a,p)=>a+p.w,0), score=Math.round(parts.reduce((a,p)=>a+p.w*p.s,0)/W);
  return {score,parts,c,label:score>=85?'Excellent':score>=70?'Good':score>=55?'Fair':'Needs work'};
}
const toneOf=s=>s>=70?'':s>=55?'mid':'low';
function sleepRes(){
  const r=sleepScore(S.date), t=S.date===todayStr();
  if(!r) return `<div class="card"><h2>${t?'Last night':'Night ending '+esc(fmtDate(S.date))}</h2><div class="empty">No sleep recorded for this morning yet. Add your bed and wake times below, or import a Memory.fit file from the Activity or Sleep tab.</div></div>`;
  const c=r.c, col=r.score>=70?'var(--mint)':r.score>=55?'var(--energy)':'var(--ember)';
  const nights=[]; for(let i=6;i>=0;i--){ const k=addDays(S.date,-i), x=sleepCalc(k); nights.push({k,m:x?Math.round(x.asleep/60*10)/10:null,s:x?sleepScore(k).score:null}); }
  const withScore=nights.filter(n=>n.s!=null), avgS=withScore.length?Math.round(withScore.reduce((a,n)=>a+n.s,0)/withScore.length):null;
  const avgH=withScore.length?withScore.reduce((a,n)=>a+n.m,0)/withScore.length:null;
  const debt=nights.filter(n=>n.m!=null).reduce((a,n)=>a+Math.max(0,7-n.m),0);
  return `<div class="card hero"><div class="hero-face"><div class="dial"><svg viewBox="0 0 156 156" role="img" aria-label="Sleep score ${r.score} out of 100, ${r.label}">${ringArc(78,66,12,col,r.score,'sleep-ring')}</svg>
      <div class="dial-c"><b data-count="${r.score}" data-ck="sleepscore">${r.score}</b><span>${r.label}</span></div></div>
    <div class="legend">
      <div class="lg"><i style="background:${col}"></i><span>Asleep</span><b>${fmtDur(c.asleep)}</b></div>
      <div class="lg"><i style="background:var(--sky)"></i><span>In bed</span><b style="font-size:16px">${fmtClock(c.bed)} to ${fmtClock(c.wake)}</b></div>
      ${c.eff!=null?`<div class="lg"><i style="background:var(--mint)"></i><span>Efficiency</span><b>${Math.round(c.eff*100)}%</b></div>`:''}
    </div></div></div>
  <div class="card"><h2>What made the score</h2>
    ${r.parts.map(p=>`<div class="sp"><div class="top"><b>${p.l} <span class="w">${Math.round(p.w/r.parts.reduce((a,x)=>a+x.w,0)*100)}% of score</span></b><span>${p.v}</span></div><div class="sbar"><i class="${toneOf(p.s)}" style="width:${Math.max(3,p.s).toFixed(0)}%"></i></div><div class="d">${p.d}</div></div>`).join('')}
    ${r.parts.length<5?`<div class="note" style="margin-top:8px">Scored on ${r.parts.length} of 5 factors. The rest need more nights or details (awake time and stage minutes).</div>`:''}</div>

    ${chart(nights.map(n=>n.m),nights.map(n=>fmtDate(n.k).replace(/^\w+, /,'')),{bar:true,target:7,tlabel:'7 h',label:'Hours asleep'})}</div>`;
}

function refreshBal(){ const g=$('#balres'); if(g) g.innerHTML=balanceResult(); }
function goalWeek(wb){

  const hit=(k,g)=>ds.filter(d=>+d[k]>=g).length, avgK=k=>{ const a=has(k); return a.length?Math.round(a.reduce((s,d)=>s+ +d[k],0)/a.length):null; };

function balanceResult(){

  <div class="card"><h2>This week</h2>

      <div class="stat"><b>${wb.actual!=null?r1(wb.actual):'–'}</b><span>lb/week on the scale</span></div>

    ${goalWeek(wb)}
    ${proj}
    <div style="margin-top:12px"><h3>Last 7 days</h3>${wb.rows.map(r=>`<div class="wrow"><span>${esc(fmtDate(r.k))}${r.logged?'':' · not logged'}</span><span>${r.b&&r.logged?`${r.b.eaten} eaten · ${r.b.burn} burned · <b style="color:${r.b.deficit>=0?'var(--accent)':'var(--warn)'}">${r.b.deficit>=0?'−':'+'}${Math.abs(r.b.deficit)}</b>${r.b.real?'':' (est.)'}`:'–'}</span></div>`).join('')}</div>

/* ----- trends (collapsible, inside Progress) ----- */
function rangeDates(n){ const t=todayStr(), out=[]; for(let i=n-1;i>=0;i--) out.push(addDays(t,-i)); return out; }
function trendsBody(){
  const ds=rangeDates(S.range), labels=ds.map(k=>fmtDate(k).replace(/^\w+, /,''));

async function toJpeg(blob,max=1400){
  const bmp=await createImageBitmap(blob);
  const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',0.82));
}
async function detectBarcode(blob){
  try{
    if(!('BarcodeDetector' in window)) return null;
    const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    const bmp=await createImageBitmap(blob); const r=await bd.detect(bmp);
    return r&&r[0]?String(r[0].rawValue):null;
  }catch(e){ return null; }
}

/* ---------- Claude estimation ---------- */
const SCHEMA = `Return JSON: {"items":[{"name":str,"serving_desc":str,"cal":number,"protein":g,"carbs":g,"fat":g,"sat":g,"trans":g,"mono":g,"poly":g,"omega3":g,"fiber":g,"sugar":g,"addedSugar":g,"sodium":mg,"caffeine":mg,"alcohol":standard drinks,"vitA":mcg RAE,"vitC":mg,"vitD":mcg,"vitE":mg,"vitK":mcg,"b12":mcg,"folate":mcg DFE,"b6":mg,"thiamin":mg,"riboflavin":mg,"niacin":mg,"calcium":mg,"iron":mg,"magnesium":mg,"potassium":mg,"zinc":mg,"groups":[from: ${FOOD_GROUPS.join(', ')}],"plants":[distinct plant foods in it, lowercase singular, e.g. "spinach","oat","almond","cumin"],"notes":str}]}. Use numbers only (0 when negligible, best estimate otherwise; never null). For alcoholic drinks, set alcohol as US standard drinks (one drink is 14 g of pure alcohol: 12 oz of 5% beer, 5 oz of 12% wine or 1.5 oz of 40% liquor each equal 1) and keep their real calories. Keep notes under 120 characters (say what you assumed or could not see).`;
/* Claude API (your own key, called straight from this device) */
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); }); }
async function claudeText(prompt,blobs,max){
  if(!SET.apiKey) throw {message:'Add your Anthropic API key in Settings to use photo and description estimates.'};
  const content=[];
  for(const b of (blobs||[])){ const j=await toJpeg(b); content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobToB64(j)}}); }
  content.push({type:'text',text:prompt});
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':SET.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:SET.model||'claude-sonnet-5-5',max_tokens:max||3000,messages:[{role:'user',content}]})});
  }catch(e){ throw {message:'Could not reach Claude. Check your internet connection.'}; }
  if(!r.ok){
    let m=''; try{ m=(await r.json()).error.message; }catch(e){}
    throw {code:r.status,message:r.status===401?'Your API key was rejected. Check it in Settings.':r.status===429?'Too many requests right now. Wait a minute and try again.':'Claude request failed ('+r.status+'). '+m};
  }
  const j=await r.json();
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
async function claudeJson(prompt,blobs){
  const t=await claudeText(prompt+'\n\nRespond with ONLY the JSON object and no other text.',blobs,3500);
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw {message:'I could not read the answer. Please try again.'};
  try{ return JSON.parse(m[0]); }catch(e){ throw {message:'I could not read the answer. Please try again.'}; }
}
function cleanItems(res){
  const arr=(res&&res.items)||[]; const out=[];
  arr.slice(0,12).forEach(x=>{ if(!x||typeof x!=='object') return; const it={name:String(x.name||'Food'),serving_desc:String(x.serving_desc||''),notes:String(x.notes||''),groups:Array.isArray(x.groups)?x.groups:[],plants:Array.isArray(x.plants)?x.plants.map(String):[],qty:1,save:false};
    NKEYS.forEach(k=>{ const v=+x[k]; it[k]=isFinite(v)&&v>0?v:0; }); out.push(it); });
  return out;
}
async function callClaude(prompt,blobs){ return await claudeJson(prompt,blobs); }
function errMsg(e){
  if(e&&e.code==='not_granted') return 'Claude estimates are not available in this view.';
  if(e&&e.code==='rate_limited') return 'Too many requests right now. Wait a minute and try again.';
  return (e&&e.message)||'Something went wrong while reading that. Please try again.';
}
async function runEstimate(){
  const dr=S.draft, text=dr.text.trim();
  if(!text && !dr.files.length){ S.est={error:'Add a photo or describe what you ate first.'}; render(); return; }
  S.est={busy:true,msg:'Claude is looking at your meal…'}; render();
  try{
    const prompt=`You are a careful nutrition estimator. The user ate the meal described and/or shown. List each distinct food or drink as its own item with nutrition for the whole portion actually eaten (not per 100 g). Estimate portion sizes from the photo (plate size, utensils) and say what you assumed in notes. Include cooking fats and condiments you can reasonably infer. For drinks like coffee, set caffeine. Do not invent items that are not mentioned or visible.\n\nUser description: ${text||'(none, photo only)'}\n\n${SCHEMA}`;
    const res=await callClaude(prompt,dr.files.map(f=>f.blob));
    const items=cleanItems(res);

  }catch(e){ S.est={error:errMsg(e)}; }
